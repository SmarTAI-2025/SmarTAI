[alembic]
script_location = backend/db/migrations
prepend_sys_path = .
# env.py supplies Settings.database_url for both runtime and migrations.
# Programmatic isolated targets use Config.attributes["database_url"] and
# Config.attributes["database_heavy"]; this ini file is not a URL override.

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
