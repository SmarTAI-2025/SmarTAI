<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="120 245 1745 390" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" version="1.1" id="svg4">
  <title id="title">SmarTAI wordmark with thicker smooth pen-nib S</title>
  <desc id="desc">The first S is smoothly thickened to match the weight of marTAI. The fountain-pen nib keeps the circular opening size while using a narrower, centered and symmetric slit; the remaining letters are unchanged.</desc>
  <metadata id="metadata1">
    Remaining letters: New York opsz 12 wght 600 GRAD 0; primary blue #489FEC.
    First-letter S and fountain-pen nib: smooth cubic Bézier silhouette, matched in weight to marTAI; centered transparent circular opening and narrow symmetric slit.
  </metadata>
