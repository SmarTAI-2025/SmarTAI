ned, taking care not to copy any extra spaces.<\/td><\/tr><tr><td><strong>API Base URL<\/strong><\/td><td>Enter the API base address. You can copy it directly from the relevant provider section.<\/td><\/tr><tr><td><strong>API protocol<\/strong><\/td><td>When using the provider's official API, keep this set to <strong>Follow provider<\/strong>.<\/td><\/tr><tr><td><strong>RPM<\/strong><\/td><td>The number of requests allowed per minute. Enter the value supplied by the provider; if you are unsure, leave it blank or enter <code>0<\/code>.<\/td><\/tr><tr><td><strong>Concurrency<\/strong><\/td><td>Adjusted automatically; no entry is needed.<\/td><\/tr><\/tbody><\/table><\/div><p>Click <strong>Save configuration<\/strong> and confirm that the configuration is <strong>Enabled<\/strong>. For configurations you use often, choose <strong>Set as default<\/strong>. To use multiple models, add a separate configuration for each.<\/p><p>An API Key is like a password. Keep it safe, and do not include it in screenshots or share it in group chats. The page will not display the full key after saving. When editing a configuration, leave the key field blank to keep the existing key.<\/p><p><strong>Where can I check costs and limits?<\/strong> In the provider's console, look for “Balance / Free quota / Resource packages” and “Rate limiting / Limits / Rate Limit.” Tokens are the units providers use to measure model usage; both input and output consume tokens. Free quotas usually apply to specific models and have an expiry date. Whether charges continue after the quota is exhausted depends on your account balance and billing settings. Setting RPM to <code>0<\/code> only means that no additional queuing-based rate limit is imposed; it does not mean the provider has no limits.<\/p><\/section><section id=\"api-api-connectivity\"><h2>Test API connectivity<\/h2><p>After saving, you can test the configuration as needed:<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">Test<\/th><th scope=\"col\">Action<\/th><th scope=\"col\">What it checks<\/th><\/tr><\/thead><tbody><tr><td><strong>Text test<\/strong><\/td><td>Click <strong>Verify (optional)<\/strong> → <strong>Run connectivity verification<\/strong>.<\/td><td>Whether the key, model name, and API address work correctly.<\/td><\/tr><tr><td><strong>Image test<\/strong><\/td><td>Click <strong>Verify vision capability<\/strong> → <strong>Run image test<\/strong>.<\/td><td>Whether the current model configuration can read images correctly.<\/td><\/tr><\/tbody><\/table><\/div><p>Each test sends one real request, consumes model quota, and may incur a charge. <strong>Canceling or closing the confirmation window does not send a request<\/strong>. Saving a configuration does not automatically run a test, and testing is not required to enable it.<\/p><p>The image test uses a small system-generated image, so you do not need to upload an assignment. Even if the result is <strong>Passed<\/strong>, you should still check recognition results for your actual files. If it says <strong>Could not confirm this time<\/strong>, troubleshoot using the error message first; do not immediately assume the model cannot recognize images.<\/p><p>If verification fails, click the reason text to view the full explanation. If verification passes but grading still does not work correctly, check the actual file recognition results, the model's remaining quota, and the error message. Passing connectivity verification does not guarantee that every task will succeed.<\/p><figure class=\"figure\" style=\"max-width:2000px\"><button type=\"button\" class=\"zoom-image\" aria-label=\"Enlarge: The outlines identify the text-connectivity and image-capability test controls on the model configuration.\"><img src=\"assets/captures/en/API3-real.jpg\" alt=\"The outlines identify the text-connectivity and image-capability test controls on the model configuration.\" width=\"2600\" height=\"532\" loading=\"lazy\" decoding=\"async\"><\/button><figcaption><span>Figure 1.4a<\/span><span>The outlines identify the text-connectivity and image-capability test controls on the model configuration.<\/span><small>Click to enlarge<\/small><\/figcaption><\/figure><\/section><section id=\"api-help\"><h2>Troubleshooting<\/h2><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">Message or symptom<\/th><th scope=\"col\">What to do<\/th><\/tr><\/thead><tbody><tr><td>Invalid key, incorrect format, or insufficient permissions<\/td><td>Copy the API Key again and check that you selected the correct provider, region, and key type.<\/td><\/tr><tr><td>Model or endpoint not found<\/td><td>Check the Model ID and API Base URL, and confirm that the model has been enabled for your account.<\/td><\/tr><tr><td>Rate limit reached or insufficient quota<\/td><td>Check the provider's balance, promotional-credit expiry date, and request limits. For per-minute rate limits, retry later; for daily quotas, wait for the provider to reset them.<\/td><\/tr><tr><td>Text test passes but image test fails<\/td><td>Confirm that the selected model supports images, then check the quota and error message.<\/td><\/tr><tr><td>Connection failure or request timeout<\/td><td>Retry later and check the API address, the provider's service status, and supported regions. If the issue persists, contact the platform administrator.<\/td><\/tr><\/tbody><\/table><\/div><p>You can select different models for question recognition, answer recognition, and grading. Images, scans, and handwritten answers require an image-capable model. Baidu OCR handles recognition only; subsequent grading still requires a large language model.<\/p><\/section><nav class=\"page-nav\" aria-label=\"Chapter navigation\"><a href=\"#api-providers\"><small>Next<\/small>Providers and API access<\/a><\/nav><footer class=\"page-foot\"><span>SmarTAI · Models & API Guide<\/span><a href=\"#api-smartai\">Back to chapter top ↑<\/a><\/footer><\/article><article class=\"chapter\" id=\"api-providers\" data-group=\"api\" data-title=\"Providers and API access\" data-number=\"2\" tabindex=\"-1\"><p class=\"breadcrumb\">Models & API Guide<span>/<\/span>2 Providers and API access<\/p><header class=\"chapter-heading\"><div class=\"chapter-number\">Chapter 2<\/div><h1>2 Providers and API access<\/h1><p class=\"intro\">Find a provider and review the application steps, configuration details, and free or trial quotas.<\/p><\/header><section id=\"api-provider-index\"><h2>Choose a provider<\/h2><p>The providers below follow the order of their entry points on the page. <strong>The order is neither a ranking nor a recommendation priority<\/strong>.<\/p><div class=\"note\"><p><strong>Network access note:<\/strong> In some network environments, accessing the official websites and API consoles for Google Gemini, OpenAI, and Anthropic Claude may require a VPN/network proxy. When applying for and using an API, also comply with the provider's supported-region requirements.<\/p><h3>You do not need to enable or switch a local proxy when using configured models in SmarTAI.<\/h3><\/div><ul><li><a href=\"#api-google\">Google Gemini / Gemma<\/a><\/li><li><a href=\"#api-openai\">OpenAI<\/a><\/li><li><a href=\"#api-claude\">Anthropic Claude<\/a><\/li><li><a href=\"#api-deepseek\">DeepSeek<\/a><\/li><li><a href=\"#api-glm\">Zhipu BigModel / GLM<\/a><\/li><li><a href=\"#api-kimi\">Kimi / Moonshot<\/a><\/li><li><a href=\"#api-qwen\">Alibaba Cloud Model Studio / Qwen<\/a><\/li><li><a href=\"#api-baidu\">Baidu Document Parsing Unlimited-OCR<\/a><\/li><li><a href=\"#api-tencent\">Tencent Hunyuan / TokenHub<\/a><\/li><li><a href=\"#api-doubao\">ByteDance Doubao / Volcano Ark<\/a><\/li><li><a href=\"#api-minimax\">MiniMax<\/a><\/li><\/ul><p>The configuration examples below use the providers' official APIs. For school-provided or other relay APIs, see <a href=\"#api-relay\">Section 3<\/a>.<\/p><\/section><nav class=\"page-nav\" aria-label=\"Chapter navigation\"><a href=\"#api-smartai\"><small>Previous<\/small>Configure models in SmarTAI<\/a><a href=\"#api-google\"><small>Next<\/small>Google Gemini / Gemma<\/a><\/nav><footer class=\"page-foot\"><span>SmarTAI · Models & API Guide<\/span><a href=\"#api-providers\">Back to chapter top ↑<\/a><\/footer><\/article><article class=\"chapter\" id=\"api-google\" data-group=\"api\" data-title=\"Google Gemini / Gemma\" data-number=\"2.1\" tabindex=\"-1\"><p class=\"breadcrumb\">Models & API Guide<span>/<\/span>2 Providers & API Access<span>/<\/span>2.1 Google Gemini / Gemma<\/p><header class=\"chapter-heading\"><div class=\"chapter-number\">Provider Guide · 2.1<\/div><h1>2.1 Google Gemini / Gemma<\/h1><p class=\"intro\">Access and configuration · Google Gemini / Gemma<\/p><\/header><section id=\"api-google-quota\"><h2>Quotas and usage notes<\/h2><div class=\"note\"><p><strong>Free quota:<\/strong> The models below offer an API free tier. Check the current project in AI Studio for specific request and token limits. Multiple keys in the same project share the quota.<\/p><\/div><p class=\"note\">Google's free tier has different data-handling rules from the paid tier, and content may be used to improve products. Read the provider's rules before use, and avoid uploading personal information without authorization. <a href=\"https://ai.google.dev/gemini-api/docs/pricing\">See the official explanation<\/a>.<\/p><\/section><section id=\"api-google-1\"><h2>Obtain an API key<\/h2><ol><li>Open <a href=\"https://aistudio.google.com/\">Google AI Studio<\/a> and sign in with your Google account.<\/li><li>Go to <strong>Dashboard → API Keys<\/strong> and click <strong>Create API key<\/strong>.<\/li><li>Select a project. If this is your first time, follow the page instructions to create a project, then copy the generated key.<\/li><li>In <a href=\"https://aistudio.google.com/rate-limit\">Rate Limit<\/a>, select the same project, check the target model's RPM, and enter it in SmarTAI.<\/li><\/ol><\/section><section id=\"api-google-3\"><h2>Enter the details in SmarTAI<\/h2><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">Field<\/th><th scope=\"col\">Value<\/th><\/tr><\/thead><tbody><tr><td>Provider<\/td><td><strong>Google Gemini<\/strong><\/td><\/tr><tr><td>Model name<\/td><td><code>gemini-3.5-flash-lite<\/code>, <code>gemini-3.8-flash<\/code>, <code>gemma-4-31b-it<\/code>, <code>gemma-4-26b-a4b-it<\/code>. Choose any one; all support text and images.<\/td><\/tr><tr><td>API key<\/td><td>The Google AI Studio key you just copied.<\/td><\/tr><tr><td>API Base URL<\/td><td><code>https://generativelanguage.googleapis.com<\/code><\/td><\/tr><tr><td>API protocol<\/td><td>Follow provider (Gemini generateContent).<\/td><\/tr><\/tbody><\/table><\/div><div class=\"note\"><p><strong>Model differences:<\/strong> <code>gemini-3.5-flash-lite<\/code> focuses on speed and low cost; <code>gemini-3.8-flash<\/code> focuses on overall capabilities; <code>gemma-4-31b-it<\/code> and <code>gemma-4-26b-a4b-it<\/code> are open-weight models, with the latter using a more efficient MoE architecture. All the models above support text and image input.<\/p><\/div><p>Gemma also uses the Google Gemini entry here. Before use, check the <a href=\"https://ai.google.dev/gemini-api/docs/available-regions\">Supported regions<\/a>.<\/p><p>Official references: <a href=\"https://ai.google.dev/gemini-api/docs/api-key\">API key instructions<\/a> · <a href=\"https://ai.google.dev/gemini-api/docs/models\">Gemini models<\/a> · <a href=\"https://ai.google.dev/gemma/docs/core/gemma_on_gemini_api\">Gemma models<\/a> · <a href=\"https://ai.google.dev/gemini-api/docs/pricing\">Pricing and free tier<\/a>.<\/p><\/section><nav class=\"page-nav\" aria-label=\"Chapter navigation\"><a href=\"#api-providers\"><small>Previous<\/small>Providers and API access<\/a><a href=\"#api-openai\"><small>Next<\/small>OpenAI<\/a><\/nav><footer class=\"page-foot\"><span>SmarTAI · Models & API Guide<\/span><a href=\"#api-google\">Back to chapter top ↑<\/a><\/footer><\/article><article class=\"chapter\" id=\"api-openai\" data-group=\"api\" data-title=\"OpenAI\" data-number=\"2.2\" tabindex=\"-1\"><p class=\"breadcrumb\">Models & API Guide<span>/<\/span>2 Providers & API Access<span>/<\/span>2.2 OpenAI<\/p><header class=\"chapter-heading\"><div class=\"chapter-number\">Provider Guide · 2.2<\/div><h1>2.2 OpenAI<\/h1><p class=\"intro\">Access and configuration · OpenAI<\/p><\/header><section id=\"api-openai-quota\"><h2>Quotas and usage notes<\/h2><div class=\"note\"><p><strong>Free quota:<\/strong> The models below do not have a general API free tier and normally use pay-as-you-go billing. Any valid API credits already in your account can offset charges. ChatGPT subscriptions and API charges are separate.<\/p><\/div><\/section><section id=\"api-openai-1\"><h2>Obtain an API key<\/h2><ol><li>Sign in to <a href=\"https://platform.openai.com/\">OpenAI Platform<\/a> and confirm the organization and project you want to use.<\/li><li>Open <a href=\"https://platform.openai.com/api-keys\">API keys<\/a> and click <strong>Create new secret key<\/strong>.<\/li><li>You can enter <code>SmarTAI<\/code> as the name. Copy the key immediately after creating it.<\/li><li>In the console, open <strong>Billing<\/strong> to check your available balance or credits, and open <a href=\"https://platform.openai.com/settings/organization/limits\">Limits<\/a> to check the target model's RPM.<\/li><\/ol><\/section><section id=\"api-openai-3\"><h2>Enter the details in SmarTAI<\/h2><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">Field<\/th><th scope=\"col\">Value<\/th><\/tr><\/thead><tbody><tr><td>Provider<\/td><td><strong>OpenAI<\/strong><\/td><\/tr><tr><td>Model name<\/td><td><code>gpt-6-luna<\/code>, <code>gpt-6.1-sol<\/code>, <code>gpt-6-astra<\/code>. Choose any one; all support text and images.<\/td><\/tr><tr><td>API key<\/td><td>The OpenAI API key you just created.<\/td><\/tr><tr><td>API Base URL<\/td><td><code>https://api.openai.com/v1<\/code><\/td><\/tr><tr><td>API protocol<\/td><td>Follow provider (OpenAI Chat Completions).<\/td><\/tr><\/tbody><\/table><\/div><div class=\"note\"><p><strong>Model differences:<\/strong> <code>gpt-6-luna<\/code> focuses on speed and low cost; <code>gpt-6.1-sol<\/code> balances capabilities and cost; <code>gpt-6-astra<\/code> is designed for more complex reasoning tasks. All three support text and image input.<\/p><\/div><p>Official references: <a href=\"https://developers.openai.com/api/docs/quickstart\">Quickstart<\/a> · <a href=\"https://developers.openai.com/api/docs/models\">Model list<\/a> · <a href=\"https://developers.openai.com/api/docs/pricing\">API pricing<\/a> · <a href=\"https://developers.openai.com/api/docs/supported-countries\">Supported regions<\/a>.<\/p><\/section><nav class=\"page-nav\" aria-label=\"Chapter navigation\"><a href=\"#api-google\"><small>Previous<\/small>Google Gemini / Gemma<\/a><a href=\"#api-claude\"><small>Next<\/small>Anthropic Claude<\/a><\/nav><footer class=\"page-foot\"><span>SmarTAI · Models & API Guide<\/span><a href=\"#api-openai\">Back to chapter top ↑<\/a><\/footer><\/article><article class=\"chapter\" id=\"api-claude\" data-group=\"api\" data-title=\"Anthropic Claude\" data-number=\"2.3\" tabindex=\"-1\"><p class=\"breadcrumb\">Models & API Guide<span>/<\/span>2 Providers & API Access<span>/<\/span>2.3 Anthropic Claude<\/p><header class=\"chapter-heading\"><div class=\"chapter-number\">Provider Guide · 2.3<\/div><h1>2.3 Anthropic Claude<\/h1><p class=\"intro\">Access and configuration · Anthropic Claude<\/p><\/header><section id=\"api-claude-quota\"><h2>Quotas and usage notes<\/h2><div class=\"note\"><p><strong>Free quota:<\/strong> New users may receive a small API trial credit; check Billing in the Console for the actual amount and expiry date. Eligible Max / Team subscribers can claim included API credits, and research projects can apply for dedicated credits. Standard API usage is billed on a pay-as-you-go basis.<\/p><p>Max / Team users can open <strong>Billing → API credits<\/strong> on the Claude website to link a Console organization and claim credits. New subscriptions must be at least 7 days old. Credits expire at the end of the billing period and do not roll over. For eligibility and amounts, see <a href=\"https://platform.claude.com/docs/en/about-claude/api-credits-for-subscribers\">API credits for subscribers<\/a>.<\/p><\/div><\/section><section id=\"api-claude-1\"><h2>Obtain an API key<\/h2><ol><li>Sign in to <a href=\"https://platform.claude.com/\">Claude Platform<\/a>.<\/li><li>Go to <strong>Settings → API Keys<\/strong> and click <strong>Create key<\/strong>.<\/li><li>Select a workspace. You can use the name <code>SmarTAI<\/code>, then copy the key after creating it.<\/li><li>In <a href=\"https://platform.claude.com/settings/billing\">Billing<\/a>, check your valid credits, and in <a href=\"https://platform.claude.com/usage/limits\">Usage → Limits<\/a>, check your current RPM.<\/li><\/ol><\/section><section id=\"api-claude-3\"><h2>Enter the details in SmarTAI<\/h2><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">Field<\/th><th scope=\"col\">Value<\/th><\/tr><\/thead><tbody><tr><td>Provider<\/td><td><strong>Claude (Anthropic)<\/strong><\/td><\/tr><tr><td>Model name<\/td><td><code>claude-sonnet-5-5<\/code>, <code>claude-opus-5-5<\/code>, <code>claude-haiku-5-5<\/code>. Choose any one; all support text and images.<\/td><\/tr><tr><td>API key<\/td><td>The Claude API key you just created.<\/td><\/tr><tr><td>API Base URL<\/td><td><code>https://api.anthropic.com<\/code><\/td><\/tr><tr><td>API protocol<\/td><td>Follow provider (Anthropic Messages).<\/td><\/tr><\/tbody><\/table><\/div><div class=\"note\"><p><strong>Model differences:<\/strong> <code>claude-haiku-5-5<\/code> focuses on speed and low cost; <code>claude-sonnet-5-5<\/code> balances speed and capabilities; <code>claude-opus-5-5<\/code> is designed for more complex tasks. All three support text and image input.<\/p><\/div><p>Official references: <a href=\"https://platform.claude.com/docs/en/api/overview\">API introduction<\/a> · <a href=\"https://platform.claude.com/docs/en/models/overview\">Model list<\/a> · <a href=\"https://platform.claude.com/docs/en/about-claude/pricing\">Pricing and trials<\/a> · <a href=\"https://www.anthropic.com/news/expanding-support-for-scientists\">Apply for research credits<\/a> · <a href=\"https://platform.claude.com/docs/en/api/supported-regions\">Supported regions<\/a>.<\/p><\/section><nav class=\"page-nav\" aria-label=\"Chapter navigation\"><a href=\"#api-openai\"><small>Previous<\/small>OpenAI<\/a><a href=\"#api-deepseek\"><small>Next<\/small>DeepSeek<\/a><\/nav><footer class=\"page-foot\"><span>SmarTAI · Models & API Guide<\/span><a href=\"#api-claude\">Back to chapter top ↑<\/a><\/footer><\/article><article class=\"chapter\" id=\"api-deepseek\" data-group=\"api\" data-title=\"DeepSeek\" data-number=\"2.4\" tabindex=\"-1\"><p class=\"breadcrumb\">Models & API Guide<span>/<\/span>2 Providers & API Access<span>/<\/span>2.4 DeepSeek<\/p><header class=\"chapter-heading\"><div class=\"chapter-number\">Provider Guide · 2.4<\/div><h1>2.4 DeepSeek<\/h1><p class=\"intro\">Access and configuration · DeepSeek<\/p><\/header><section id=\"api-deepseek-quota\"><h2>Quotas and usage notes<\/h2><div class=\"note\"><p><strong>Free quota:<\/strong> Model API usage is billed on a pay-as-you-go basis, with any existing promotional balance used first. Current public official documentation does not specify a standard new-user credit. Free web chat does not mean the API is free.<\/p><\/div><\/section><section id=\"api-deepseek-1\"><h2>Obtain an API key<\/h2><ol><li>Sign in to <a href=\"https://platform.deepseek.com/\">DeepSeek Platform<\/a>.<\/li><li>Open <a href=\"https://platform.deepseek.com/api_keys\">API keys<\/a>, then create and copy a key.<\/li><li>In <a href=\"https://platform.deepseek.com/balance\">Balance<\/a>, check your purchased balance, promotional balance, and expiry dates. Top up as needed if your balance is insufficient.<\/li><li>Return to SmarTAI, select DeepSeek, enter the details below, and save.<\/li><\/ol><\/section><section id=\"api-deepseek-3\"><h2>Enter the details in SmarTAI<\/h2><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">Field<\/th><th scope=\"col\">Value<\/th><\/tr><\/thead><tbody><tr><td>Provider<\/td><td><strong>DeepSeek<\/strong><\/td><\/tr><tr><td>Model name<\/td><td><code>deepseek-flash<\/code>: text and images; <code>deepseek-v4-pro<\/code>: text. Choose either one.<\/td><\/tr><tr><td>API key<\/td><td>The DeepSeek key you just created.<\/td><\/tr><tr><td>API Base URL<\/td><td><code>https://api.deepseek.com/v1<\/code><\/td><\/tr><tr><td>API protocol<\/td><td>Follow provider (OpenAI Chat Completions).<\/td><\/tr><\/tbody><\/table><\/div><div class=\"note\"><p><strong>Model differences:<\/strong> <code>deepseek-flash<\/code> supports text and image input and is suitable for general grading and image recognition; <code>deepseek-v4-pro<\/code> supports text input only and can be used for text-only grading and review. For image recognition, select <code>deepseek-flash<\/code>.<\/p><\/div><p>The “concurrency” value on the provider's page is not RPM; do not enter it in the RPM field.<\/p><p>Official references: <a href=\"https://api-docs.deepseek.com/zh-cn/\">Your first API call<\/a> · <a href=\"https://api-docs.deepseek.com/zh-cn/quick_start/pricing/\">Models and pricing<\/a> · <a href=\"https://api-docs.deepseek.com/zh-cn/quick_start/rate_limit/\">Rate-limit details<\/a>.<\/p><\/section><nav class=\"page-nav\" aria-label=\"Chapter navigation\"><a href=\"#api-claude\"><small>Previous<\/small>Anthropic Claude<\/a><a href=\"#api-glm\"><small>Next<\/small>Zhipu BigModel / GLM<\/a><\/nav><footer class=\"page-foot\"><span>SmarTAI · Models & API Guide<\/span><a href=\"#api-deepseek\">Back to chapter top ↑<\/a><\/footer><\/article><article class=\"chapter\" id=\"api-glm\" data-group=\"api\" data-title=\"Zhipu BigModel / GLM\" data-number=\"2.5\" tabindex=\"-1\"><p class=\"breadcrumb\">Models & API Guide<span>/<\/span>2 Providers & API Access<span>/<\/span>2.5 Zhipu BigModel / GLM<\/p><header class=\"chapter-heading\"><div class=\"chapter-number\">Provider Guide · 2.5<\/div><h1>2.5 Zhipu BigModel / GLM<\/h1><p class=\"intro\">Access and configuration · Zhipu BigModel / GLM<\/p><\/header><section id=\"api-glm-quota\"><h2>Quotas and usage notes<\/h2><div class=\"note\"><p><strong>Free quota:<\/strong> <code>glm-4.7-flash<\/code> and <code>glm-4.6v-flash<\/code> are currently free; <code>glm-5.3<\/code>, <code>glm-5.3-flash<\/code> use pay-as-you-go billing. After receiving a new-user resource package, check which models it covers and when it expires.<\/p><\/div><\/section><section id=\"api-glm-1\"><h2>Obtain an API key<\/h2><ol><li>Register or sign in to <a href=\"https://open.bigmodel.cn/\">BigModel<\/a>.<\/li><li>Open <a href=\"https://bigmodel.cn/usercenter/proj-mgmt/apikeys\">API Keys<\/a>, select <strong>Standard API Key<\/strong>, and create a key.<\/li><li>Copy the key. Use a standard Key here, not a personal-plan or team-plan Key.<\/li><li>Check resource packages, usage, and limits in the console, then return to SmarTAI to enter the details.<\/li><\/ol><\/section><section id=\"api-glm-3\"><h2>Enter the details in SmarTAI<\/h2><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">Field<\/th><th scope=\"col\">Value<\/th><\/tr><\/thead><tbody><tr><td>Provider<\/td><td><strong>Zhipu<\/strong><\/td><\/tr><tr><td>Model name<\/td><td>Text: <code>glm-4.7-flash<\/code>, <code>glm-5.3<\/code>; text/images: <code>glm-4.6v-flash<\/code>, <code>glm-5.3-flash<\/code>. Choose any one.<\/td><\/tr><tr><td>API key<\/td><td>The newly created <strong>Standard API Key<\/strong>.<\/td><\/tr><tr><td>API Base URL<\/td><td><code>https://open.bigmodel.cn/api/paas/v4<\/code><\/td><\/tr><tr><td>API protocol<\/td><td>Follow provider (OpenAI Chat Completions).<\/td><\/tr><\/tbody><\/table><\/div><div class=\"note\"><p><strong>Model differences:<\/strong> <code>glm-4.7-flash<\/code> is a free text model; <code>glm-4.6v-flash<\/code> is a free vision model. glm-5.3 is designed for complex text tasks, and <code>glm-5.3-flash<\/code> supports text and image input. Standard API usage for the latter two is normally billed on a pay-as-you-go basis.<\/p><\/div><p>The configuration above is for the mainland China BigModel platform. If you have an overseas Z.ai account, use that site's Key and address, <code>https://api.z.ai/api/paas/v4<\/code>. Do not mix credentials from the two sites.<\/p><p>Official references: <a href=\"https://docs.bigmodel.cn/cn/guide/start/quick-start/\">Quickstart<\/a> · <a href=\"https://docs.bigmodel.cn/cn/guide/start/model-overview\">Model list<\/a> · <a href=\"https://docs.bigmodel.cn/cn/guide/start/pricing\">Pricing<\/a> · <a href=\"https://docs.bigmodel.cn/cn/coding-plan/notice/api-key-management\">Key types<\/a>.<\/p><\/section><nav class=\"page-nav\" aria-label=\"Chapter navigation\"><a href=\"#api-deepseek\"><small>Previous<\/small>DeepSeek<\/a><a href=\"#api-kimi\"><small>Next<\/small>Kimi / Moonshot<\/a><\/nav><footer class=\"page-foot\"><span>SmarTAI · Models & API Guide<\/span><a href=\"#api-glm\">Back to chapter top ↑<\/a><\/footer><\/article><article class=\"chapter\" id=\"api-kimi\" data-group=\"api\" data-title=\"Kimi / Moonshot\" data-number=\"2.6\" tabindex=\"-1\"><p class=\"breadcrumb\">Models & API Guide<span>/<\/span>2 Providers & API Access<span>/<\/span>2.6 Kimi / Moonshot<\/p><header class=\"chapter-heading\"><div class=\"chapter-number\">Provider Guide · 2.6<\/div><h1>2.6 Kimi / Moonshot<\/h1><p class=\"intro\">Access and configuration · Kimi / Moonshot<\/p><\/header><section id=\"api-kimi-quota\"><h2>Quotas and usage notes<\/h2><div class=\"note\"><p><strong>Free quota:<\/strong> New users registering with a mainland China mobile number can receive an RMB 15 API voucher after completing real-name verification. It is valid for 3 months. <strong>This voucher cannot be used for Kimi K3<\/strong>. Once the voucher is exhausted, usage is charged to the account balance.<\/p><\/div><\/section><section id=\"api-kimi-1\"><h2>Obtain an API key<\/h2><ol><li>Register or sign in to <a href=\"https://platform.kimi.com/\">Kimi API Platform<\/a>.<\/li><li>Complete real-name verification in the user center and check whether the new-user voucher has been credited.<\/li><li>Go to <strong>API Keys<\/strong>, then create and copy a key.<\/li><li>Check billing details for the models covered by the voucher and its expiry date, and check the rate-limits page for RPM.<\/li><\/ol><\/section><section id=\"api-kimi-3\"><h2>Enter the details in SmarTAI<\/h2><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">Field<\/th><th scope=\"col\">Value<\/th><\/tr><\/thead><tbody><tr><td>Provider<\/td><td><strong>Kimi (Moonshot)<\/strong><\/td><\/tr><tr><td>Model name<\/td><td><code>kimi-k2.6<\/code> or <code>kimi-k3<\/code>. Both support text and images; to use the new-user voucher, choose <code>kimi-k2.6<\/code>.<\/td><\/tr><tr><td>API key<\/td><td>Your API key from the Kimi Platform.<\/td><\/tr><tr><td>API Base URL<\/td><td><code>https://api.moonshot.cn/v1<\/code><\/td><\/tr><tr><td>API protocol<\/td><td>Follow provider (OpenAI Chat Completions).<\/td><\/tr><\/tbody><\/table><\/div><div class=\"note\"><p><strong>Model differences:<\/strong> <code>kimi-k2.6<\/code> is suitable for general text-and-image tasks, and eligible new users can use trial vouchers; <code>kimi-k3<\/code> is designed for complex reasoning and long-text tasks but is not covered by this new-user voucher. Both support text and image input.<\/p><\/div><p>Kimi web subscriptions, Kimi Code, and API balances are separate. The overseas platform <code>platform.kimi.ai<\/code> uses <code>https://api.moonshot.ai/v1<\/code>, and its accounts, keys, and balances are independent of the mainland China site.<\/p><p>Official references: <a href=\"https://www.kimi.com/help/kimi-api/api-free-trial\">Free benefits for new users<\/a> · <a href=\"https://platform.kimi.com/docs/models\">Model list<\/a> · <a href=\"https://www.kimi.com/help/kimi-api/api-rate-limits\">Rate limits<\/a> · <a href=\"https://www.kimi.com/help/kimi-api/api-troubleshooting\">FAQ<\/a>.<\/p><\/section><nav class=\"page-nav\" aria-label=\"Chapter navigation\"><a href=\"#api-glm\"><small>Previous<\/small>Zhipu BigModel / GLM<\/a><a href=\"#api-qwen\"><small>Next<\/small>Alibaba Cloud Model Studio / Qwen<\/a><\/nav><footer class=\"page-foot\"><span>SmarTAI · Models & API Guide<\/span><a href=\"#api-kimi\">Back to chapter top ↑<\/a><\/footer><\/article><article class=\"chapter\" id=\"api-qwen\" data-group=\"api\" data-title=\"Alibaba Cloud Model Studio / Qwen\" data-number=\"2.7\" tabindex=\"-1\"><p class=\"breadcrumb\">Models & API Guide<span>/<\/span>2 Providers & API Access<span>/<\/span>2.7 Alibaba Cloud Model Studio / Qwen<\/p><header class=\"chapter-heading\"><div class=\"chapter-number\">Provider Guide · 2.7<\/div><h1>2.7 Alibaba Cloud Model Studio / Qwen<\/h1><p class=\"intro\">Access and configuration · Alibaba Cloud Model Studio / Qwen<\/p><\/header><section id=\"api-qwen-quota\"><h2>Quotas and usage notes<\/h2><div class=\"note\"><p><strong>Free quota:<\/strong> Eligible new users in China (Beijing), China North 2, receive a quota of 1 million tokens for each of the two models below, usually valid for 90 days. If you only want to use the free quota, enable <strong>Stop when free quota is exhausted<\/strong>.<\/p><\/div><\/section><section id=\"api-qwen-1\"><h2>Obtain an API key<\/h2><ol><li>Sign in to <a href=\"https://bailian.console.aliyun.com/\">Alibaba Cloud Model Studio<\/a>, select the region <strong>China North 2 (Beijing)<\/strong>, and follow the prompts to activate the service.<\/li><li>Open <a href=\"https://bailian.console.aliyun.com/cn-beijing/model/settings/api-key\">API Key page<\/a> and click <strong>Create API Key<\/strong>. For personal use, you can select the primary account and default workspace, and create the key with the page's default permissions.<\/li><li>Copy the key. On the <strong>Free quota<\/strong> page, search for the target model, check the remaining quota and expiry date, and enable <strong>Stop when exhausted<\/strong> as needed.<\/li><li>Return to SmarTAI, select Qwen, and enter the details below. Use a standard API Key, not a dedicated Coding Plan / Token Plan Key.<\/li><\/ol><\/section><section id=\"api-qwen-3\"><h2>Enter the details in SmarTAI<\/h2><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">Field<\/th><th scope=\"col\">Value<\/th><\/tr><\/thead><tbody><tr><td>Provider<\/td><td><strong>Qwen (Tongyi Qianwen)<\/strong><\/td><\/tr><tr><td>Model name<\/td><td><code>qwen3.8-max<\/code> or <code>qwen3.8-flash<\/code>. Both support text and images.<\/td><\/tr><tr><td>API key<\/td><td>A standard API key created in the Beijing region.<\/td><\/tr><tr><td>API Base URL<\/td><td><code>https://dashscope.aliyuncs.com/compatible-mode/v1<\/code><\/td><\/tr><tr><td>API protocol<\/td><td>Follow provider (OpenAI Chat Completions).<\/td><\/tr><\/tbody><\/table><\/div><div class=\"note\"><p><strong>Model differences:<\/strong> <code>qwen3.8-max<\/code> is the flagship model, focusing on complex reasoning and multimodal understanding; <code>qwen3.8-flash<\/code> focuses on speed and low cost. Both support text and image input. Check your own console for the new-user free quota.<\/p><\/div><p>These two models use dynamic rate limiting. If the page does not provide an RPM value, leave it blank or enter <code>0<\/code>. If you select a different region, use the key and address for that region as well.<\/p><p>Official references: <a href=\"https://help.aliyun.com/zh/model-studio/get-api-key\">Obtain a key<\/a> · <a href=\"https://help.aliyun.com/zh/model-studio/new-free-quota\">New-user quota rules<\/a> · <a href=\"https://help.aliyun.com/zh/model-studio/model-pricing\">Models and pricing<\/a> · <a href=\"https://help.aliyun.com/zh/model-studio/rate-limit\">Rate-limit details<\/a>.<\/p><\/section><nav class=\"page-nav\" aria-label=\"Chapter navigation\"><a href=\"#api-kimi\"><small>Previous<\/small>Kimi / Moonshot<\/a><a href=\"#api-baidu\"><small>Next<\/small>Baidu Document Parsing Unlimited-OCR<\/a><\/nav><footer class=\"page-foot\"><span>SmarTAI · Models & API Guide<\/span><a href=\"#api-qwen\">Back to chapter top ↑<\/a><\/footer><\/article><article class=\"chapter\" id=\"api-baidu\" data-group=\"api\" data-title=\"Baidu Document Parsing Unlimited-OCR\" data-number=\"2.8\" tabindex=\"-1\"><p class=\"breadcrumb\">Models & API Guide<span>/<\/span>2 Providers & API Access<span>/<\/span>2.8 Baidu Document Parsing Unlimited-OCR<\/p><header class=\"chapter-heading\"><div class=\"chapter-number\">Provider Guide · 2.8<\/div><h1>2.8 Baidu Document Parsing Unlimited-OCR<\/h1><p class=\"intro\">Access and configuration · Baidu Document Parsing Unlimited-OCR<\/p><\/header><section id=\"api-baidu-quota\"><h2>Quotas and usage notes<\/h2><div class=\"note\"><p><strong>Free quota:<\/strong> The current limited-time free quota is 200 pages for individually verified accounts and 1000 pages for enterprise-verified accounts. Check the OCR console for remaining pages and expiry dates. “Unlimited” is the product name; it does not mean unlimited free usage.<\/p><\/div><p><strong>Purpose:<\/strong> Unlimited-OCR extracts text and structured content from images, PDFs, and other documents. It does not grade assignments or assign scores. After recognition, a large language model is still needed for grading.<\/p><\/section><section id=\"api-baidu-1\"><h2>Obtain and save credentials<\/h2><ol><li>Register or sign in to <a href=\"https://console.bce.baidu.com/ai-engine/ocr/overview/index\">Baidu AI Cloud<\/a> and complete individual or enterprise real-name verification.<\/li><li>Go to <strong>OCR console<\/strong>, activate <strong>Document Parsing (Unlimited-OCR)<\/strong>, and check the resource list for your free page quota.<\/li><li>Go to <strong>Application list → Create application<\/strong> and select the permissions for the document parsing API.<\/li><li>In the application list, copy the application's <strong>API Key<\/strong> and <strong>Secret Key<\/strong>.<\/li><li>Return to “Models & BYOK” in SmarTAI and find <strong>Baidu Document Parsing (Unlimited-OCR)<\/strong>. Enter the <strong>API Key<\/strong> and <strong>Secret Key<\/strong> into their respective fields, then click “Save credentials.”<\/li><\/ol><p>You do not need to enter a model name or Base URL here. Do not use the cloud account keys under Baidu Cloud's “Security credentials / Access Key.”<\/p><p>After saving, click <strong>Verify API Key / Secret Key<\/strong> to check the credentials. For actual recognition, select Baidu OCR in the task. Credential verification does not submit a file. Actual OCR calls consume pages, and failed calls may also consume free resources.<\/p><p>Official references: <a href=\"https://ai.baidu.com/ai-doc/OCR/dk3iqnq51\">Beginner's guide<\/a> · <a href=\"https://ai.baidu.com/ai-doc/OCR/fmr1p39gb\">Unlimited-OCR overview<\/a> · <a href=\"https://ai.baidu.com/ai-doc/OCR/fk3h7xu7h\">Free resource rules<\/a>.<\/p><\/section><nav class=\"page-nav\" aria-label=\"Chapter navigation\"><a href=\"#api-qwen\"><small>Previous<\/small>Alibaba Cloud Model Studio / Qwen<\/a><a href=\"#api-tencent\"><small>Next<\/small>Tencent Hunyuan / TokenHub<\/a><\/nav><footer class=\"page-foot\"><span>SmarTAI · Models & API Guide<\/span><a href=\"#api-baidu\">Back to chapter top ↑<\/a><\/footer><\/article><article class=\"chapter\" id=\"api-tencent\" data-group=\"api\" data-title=\"Tencent Hunyuan / TokenHub\" data-number=\"2.9\" tabindex=\"-1\"><p class=\"breadcrumb\">Models & API Guide<span>/<\/span>2 Providers & API Access<span>/<\/span>2.9 Tencent Hunyuan / TokenHub<\/p><header class=\"chapter-heading\"><div class=\"chapter-number\">Provider Guide · 2.9<\/div><h1>2.9 Tencent Hunyuan / TokenHub<\/h1><p class=\"intro\">Access and configuration · Tencent Hunyuan / TokenHub<\/p><\/header><section id=\"api-tencent-quota\"><h2>Quotas and usage notes<\/h2><div class=\"note\"><p><strong>Free quota:<\/strong> The current new-user promotion ends on 2026-12-31. Language and multimodal-understanding models offer a trial quota of 1 million tokens, valid for 1 year after claiming it. Check “Activation management” for eligible models, remaining quota, and expiry dates. If postpaid billing is not enabled, calls stop when the free quota is exhausted.<\/p><\/div><\/section><section id=\"api-tencent-1\"><h2>Obtain an API key<\/h2><ol><li>Sign in to <a href=\"https://cloud.tencent.com/product/tokenhub\">Tencent Cloud TokenHub<\/a> and complete real-name verification.<\/li><li>Go to <strong>Model marketplace → Free trial for new users<\/strong>, select the models you want to use, and click <strong>Claim now<\/strong>.<\/li><li>Go to <strong>API Key management<\/strong>, select the <strong>Guangzhou<\/strong> region and click <strong>Create API Key<\/strong>.<\/li><li>You can enter <code>SmarTAI<\/code> as the name. Under “Scope,” select the models you want to use, confirm, and copy the full key.<\/li><\/ol><\/section><section id=\"api-tencent-3\"><h2>Enter the details in SmarTAI<\/h2><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">Field<\/th><th scope=\"col\">Value<\/th><\/tr><\/thead><tbody><tr><td>Provider<\/td><td><strong>Tencent Hunyuan (TokenHub)<\/strong><\/td><\/tr><tr><td>Model name<\/td><td><code>hy3<\/code>: text; <code>hy-vision-2.0-instruct<\/code>: text and images. Choose either one.<\/td><\/tr><tr><td>API key<\/td><td>A TokenHub key created in the Guangzhou region.<\/td><\/tr><tr><td>API Base URL<\/td><td><code>https://tokenhub.tencentmaas.com/v1<\/code><\/td><\/tr><tr><td>API protocol<\/td><td>Follow provider (OpenAI Chat Completions).<\/td><\/tr><\/tbody><\/table><\/div><div class=\"note\"><p><strong>Model differences:<\/strong> <code>hy3<\/code> is a general-purpose text reasoning model; <code>hy-vision-2.0-instruct<\/code> is a vision-understanding model that supports image content recognition, OCR, and chart understanding. Choose the latter when you need image recognition.<\/p><\/div><p>Official references: <a href=\"https://cloud.tencent.com/document/product/1823/130058\">Getting started<\/a> · <a href=\"https://cloud.tencent.com/document/product/1823/130051\">Model list<\/a> · <a href=\"https://cloud.tencent.com/document/product/1823/136956\">Image understanding<\/a> · <a href=\"https://cloud.tencent.com/document/product/1823/130053/\">New-user quota rules<\/a>.<\/p><\/section><nav class=\"page-nav\" aria-label=\"Chapter navigation\"><a href=\"#api-baidu\"><small>Previous<\/small>Baidu Document Parsing Unlimited-OCR<\/a><a href=\"#api-doubao\"><small>Next<\/small>ByteDance Doubao / Volcano Ark<\/a><\/nav><footer class=\"page-foot\"><span>SmarTAI · Models & API Guide<\/span><a href=\"#api-tencent\">Back to chapter top ↑<\/a><\/footer><\/article><article class=\"chapter\" id=\"api-doubao\" data-group=\"api\" data-title=\"ByteDance Doubao / Volcano Ark\" data-number=\"2.10\" tabindex=\"-1\"><p class=\"breadcrumb\">Models & API Guide<span>/<\/span>2 Providers & API Access<span>/<\/span>2.10 ByteDance Doubao / Volcano Ark<\/p><header class=\"chapter-heading\"><div class=\"chapter-number\">Provider Guide · 2.10<\/div><h1>2.10 ByteDance Doubao / Volcano Ark<\/h1><p class=\"intro\">Access and configuration · ByteDance Doubao / Volcano Ark<\/p><\/header><section id=\"api-doubao-quota\"><h2>Quotas and usage notes<\/h2><div class=\"note\"><p><strong>Free quota:<\/strong> New users receive model API trial quotas, calculated separately for each model. Check “Activation management” for remaining quotas and expiry dates. If you only want to use the promotional quota, eligible accounts can enable <strong>Worry-free trial mode<\/strong> to avoid switching to paid calls.<\/p><\/div><\/section><section id=\"api-doubao-1\"><h2>Obtain an API key<\/h2><ol><li>Register or sign in to <a href=\"https://ark.volcengine.com/\">Volcano Ark<\/a>, and select the <strong>Beijing<\/strong> region.<\/li><li>In <strong>Activation management<\/strong>, find the model you want to use, follow the prompts to activate its free trial, and enable <strong>Worry-free trial mode<\/strong> as needed.<\/li><li>Go to <a href=\"https://ark.volcengine.com/region:cn-beijing/apikey\">API Key management<\/a> and click <strong>Create API Key<\/strong>. For personal use, you can keep the default project workspace.<\/li><li>You can enter <code>SmarTAI<\/code> as the name, then view and copy the key from the list after creating it.<\/li><\/ol><\/section><section id=\"api-doubao-3\"><h2>Enter the details in SmarTAI<\/h2><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">Field<\/th><th scope=\"col\">Value<\/th><\/tr><\/thead><tbody><tr><td>Provider<\/td><td><strong>Doubao (Volcano Ark)<\/strong><\/td><\/tr><tr><td>Model name<\/td><td><code>doubao-seed-2-1-pro-260915<\/code> or <code>doubao-seed-2-1-lite-260915<\/code>. Both support text and images.<\/td><\/tr><tr><td>API key<\/td><td>A standard API key for the Beijing region.<\/td><\/tr><tr><td>API Base URL<\/td><td><code>https://ark.cn-beijing.volces.com/api/v3<\/code><\/td><\/tr><tr><td>API protocol<\/td><td>Follow provider (OpenAI Chat Completions).<\/td><\/tr><\/tbody><\/table><\/div><div class=\"note\"><p><strong>Model differences:<\/strong> <code>doubao-seed-2-1-pro-260915<\/code> focuses on complex reasoning and overall capabilities; <code>doubao-seed-2-1-lite-260915<\/code> focuses on speed and low cost. Both support text and image input.<\/p><\/div><p>For the models above, simply enter the Model ID; you do not need to create an additional inference endpoint. Use a standard API Key, and do not mix it with Coding / Agent Plan subscription keys.<\/p><p>Official references: <a href=\"https://console.volcengine.com/ark/region:cn-beijing/docs/api-key\">Obtain a key<\/a> · <a href=\"https://console.volcengine.com/ark/region:cn-beijing/docs/model-list\">Model list<\/a> · <a href=\"https://console.volcengine.com/ark/region:cn-beijing/docs/activation-management\">Activation management<\/a> · <a href=\"https://console.volcengine.com/ark/region:cn-beijing/docs/free-inference-quota\">Free inference quota<\/a>.<\/p><\/section><nav class=\"page-nav\" aria-label=\"Chapter navigation\"><a href=\"#api-tencent\"><small>Previous<\/small>Tencent Hunyuan / TokenHub<\/a><a href=\"#api-minimax\"><small>Next<\/small>MiniMax<\/a><\/nav><footer class=\"page-foot\"><span>SmarTAI · Models & API Guide<\/span><a href=\"#api-doubao\">Back to chapter top ↑<\/a><\/footer><\/article><article class=\"chapter\" id=\"api-minimax\" data-group=\"api\" data-title=\"MiniMax\" data-number=\"2.11\" tabindex=\"-1\"><p class=\"breadcrumb\">Models & API Guide<span>/<\/span>2 Providers & API Access<span>/<\/span>2.11 MiniMax<\/p><header class=\"chapter-heading\"><div class=\"chapter-number\">Provider Guide · 2.11<\/div><h1>2.11 MiniMax<\/h1><p class=\"intro\">Access and configuration · MiniMax<\/p><\/header><section id=\"api-minimax-quota\"><h2>Quotas and usage notes<\/h2><div class=\"note\"><p><strong>Free quota:<\/strong> Standard API usage is billed on a pay-as-you-go basis. Current public official documentation does not specify a standard new-customer credit. Free web trials and M Plan subscription quotas are separate from the standard API balance.<\/p><\/div><\/section><section id=\"api-minimax-1\"><h2>Obtain an API key<\/h2><ol><li>Sign in to <a href=\"https://platform.minimax.cn/\">MiniMax Platform<\/a>.<\/li><li>Open <a href=\"https://platform.minimax.cn/console/access?tab=api-keys\">API keys<\/a> and click <strong>Create new API Key<\/strong>, then copy the pay-as-you-go key.<\/li><li>In <strong>Account management → Balance<\/strong>, check your available balance and top up as needed. Do not use an M Plan subscription Key in place of a standard API Key.<\/li><li>Return to SmarTAI, select MiniMax, enter the details below, and save.<\/li><\/ol><\/section><section id=\"api-minimax-3\"><h2>Enter the details in SmarTAI<\/h2><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">Field<\/th><th scope=\"col\">Value<\/th><\/tr><\/thead><tbody><tr><td>Provider<\/td><td><strong>MiniMax<\/strong><\/td><\/tr><tr><td>Model name<\/td><td><code>MiniMax-M3<\/code> supports text and images. Preserve the capitalization exactly.<\/td><\/tr><tr><td>API key<\/td><td>A standard pay-as-you-go API key.<\/td><\/tr><tr><td>API Base URL<\/td><td><code>https://api.minimax.cn/v1<\/code><\/td><\/tr><tr><td>API protocol<\/td><td>Follow provider (OpenAI Chat Completions).<\/td><\/tr><\/tbody><\/table><\/div><p>With a standard pay-as-you-go Key, use the corresponding model from the model list; <code>MiniMax-M3.1-Flash-Preview<\/code> is currently offered through M Plan / MiniMax Code.<\/p><p>Official references: <a href=\"https://platform.minimax.cn/docs/guides/quickstart-preparation\">Access and preparation<\/a> · <a href=\"https://platform.minimax.cn/docs/faq/models\">Model list<\/a> · <a href=\"https://platform.minimax.cn/docs/pricing/overview\">API pricing<\/a> · <a href=\"https://platform.minimax.cn/docs/faq/about-account\">Account information<\/a>.<\/p><\/section><nav class=\"page-nav\" aria-label=\"Chapter navigation\"><a href=\"#api-doubao\"><small>Previous<\/small>ByteDance Doubao / Volcano Ark<\/a><a href=\"#api-relay\"><small>Next<\/small>School-provided and other relay APIs<\/a><\/nav><footer class=\"page-foot\"><span>SmarTAI · Models & API Guide<\/span><a href=\"#api-minimax\">Back to chapter top ↑<\/a><\/footer><\/article><article class=\"chapter\" id=\"api-relay\" data-group=\"api\" data-title=\"School-provided and other relay APIs\" data-number=\"3\" tabindex=\"-1\"><p class=\"breadcrumb\">Models & API Guide<span>/<\/span>3 School-provided and other relay APIs<\/p><header class=\"chapter-heading\"><div class=\"chapter-number\">Chapter 3<\/div><h1>3 School-provided and other relay APIs<\/h1><p class=\"intro\">When using an API provided by a school or institution, follow its configuration details and limits.<\/p><\/header><section id=\"api-relay-fields\"><h2>Obtain and enter the configuration<\/h2><p>If you use an API provided by a school, institution, or another relay provider, first obtain the <strong>API Key, API Base URL, Model ID, and API protocol<\/strong> from them, then enter the details according to their documentation.<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">Field<\/th><th scope=\"col\">How to enter it<\/th><\/tr><\/thead><tbody><tr><td><strong>Provider<\/strong><\/td><td>Select the provider specified in the relay provider's documentation.<\/td><\/tr><tr><td><strong>API key<\/strong><\/td><td>Enter the key supplied by the relay provider.<\/td><\/tr><tr><td><strong>API Base URL<\/strong><\/td><td>Enter the base address supplied by the relay provider rather than the model provider's official address.<\/td><\/tr><tr><td><strong>Model name<\/strong><\/td><td>Enter the relay provider's <strong>Model ID<\/strong>. The same model may have different names on different relay services.<\/td><\/tr><tr><td><strong>API protocol, RPM<\/strong><\/td><td>Use the values in the relay provider's documentation or those supplied by the administrator.<\/td><\/tr><\/tbody><\/table><\/div><p>For example, if the relay provider gives you the base address <code>https://example.edu/v1<\/code>, enter that address without adding <code>/chat/completions<\/code>.<\/p><p>After saving, check the configuration using the <a href=\"#api-api-connectivity\">text and image tests<\/a>. If you encounter problems with the key, balance, model name, API address, or connection, <strong>contact the relay provider or school administrator first<\/strong> and provide the error message. Follow their documentation for the specific configuration procedure.<\/p><\/section><nav class=\"page-nav\" aria-label=\"Chapter navigation\"><a href=\"#api-minimax\"><small>Previous<\/small>MiniMax<\/a><\/nav><footer class=\"page-foot\"><span>SmarTAI · Models & API Guide<\/span><a href=\"#api-relay\">Back to chapter top ↑<\/a><\/footer><\/article><div class=\"search-results\" id=\"search-results\" hidden aria-live=\"polite\"><\/div><\/div><aside class=\"page-outline\" aria-label=\"On this page\"><div class=\"outline-title\">On this page<\/div><nav id=\"outline\"><\/nav><\/aside><\/div><\/main>\n<dialog class=\"lightbox\" id=\"lightbox\"><div class=\"lightbox-head\"><p id=\"lightbox-caption\"><\/p><button class=\"lightbox-close\" id=\"lightbox-close\" type=\"button\">Close · Esc<\/button><\/div><div class=\"lightbox-image-wrap\"><img id=\"lightbox-image\" alt=\"\"><\/div><\/dialog>\n<script>(()=>{'use strict';\nconst $=s=>document.querySelector(s), chapters=[...document.querySelectorAll('.chapter')], search=$('#search'), results=$('#search-results'), outline=$('#outline'), menu=$('#menu');\nlet active=chapters[0], observer;const books={manual:'User Manual',api:'Models & API Guide'};const last={manual:'quickstart',api:'api-smartai'};\nconst escape=s=>s.replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nfunction closeMenu(){document.body.classList.remove('nav-open');menu.setAttribute('aria-expanded','false');menu.setAttribute('aria-label','Open contents')}\nfunction renderChapter(){let id;try{id=decodeURIComponent(location.hash.slice(1))}catch{id=''}const target=document.getElementById(id);active=target?.closest('.chapter')||chapters.find(c=>c.id===id)||chapters[0];chapters.forEach(c=>c.hidden=c!==active);const group=active.dataset.group;last[group]=active.id;document.querySelectorAll('.book-tabs a').forEach(a=>{a.href='#'+last[a.dataset.book];if(a.dataset.book===group)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});document.querySelectorAll('.chapter-nav').forEach(n=>n.hidden=n.dataset.group!==group);$('#toc-label').textContent=books[group]+' · Contents';results.hidden=true;document.querySelector('.page-outline').hidden=false;search.value='';document.title=`${active.dataset.title} · SmarTAI Teacher Manual`;document.querySelectorAll('.chapter-nav a').forEach(a=>{if(a.hash===`#${active.id}`)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});document.querySelectorAll('.section-nav').forEach(n=>n.hidden=n.dataset.parent!==active.id);document.querySelectorAll('.chapter-nav a').forEach(a=>{a.classList.toggle('is-parent',group==='api'&&active.dataset.number.startsWith('2.')&&a.hash==='#api-providers');if(a.hash==='#'+id&&id!==active.id)a.setAttribute('aria-current','location')});outline.innerHTML=[...active.querySelectorAll('section')].map(s=>`<a href=\"#${s.id}\">${escape(s.querySelector('h2').textContent)}<\/a>`).join('');if(observer)observer.disconnect();observer=new IntersectionObserver(entries=>{for(const e of entries)if(e.isIntersecting){outline.querySelectorAll('a').forEach(a=>a.classList.toggle('active',a.hash===`#${e.target.id}`))}},{rootMargin:'-100px 0px -65% 0px'});active.querySelectorAll('section').forEach(s=>observer.observe(s));closeMenu();requestAnimationFrame(()=>{if(target&&target!==active)target.scrollIntoView();else window.scrollTo({top:0,behavior:'instant'})})}\nfunction performSearch(){const query=search.value.trim();if(!query){renderChapter();return}chapters.forEach(c=>c.hidden=true);document.querySelector('.page-outline').hidden=true;results.hidden=false;const terms=query.toLocaleLowerCase().split(/\\s+/);const found=[];for(const c of chapters){for(const s of c.querySelectorAll('section')){const text=s.textContent.replace(/\\s+/g,' ').trim();const hay=(c.dataset.title+' '+text).toLocaleLowerCase();if(terms.every(t=>hay.includes(t))){const first=text.toLocaleLowerCase().indexOf(terms[0]);const start=Math.max(0,first-30);found.push({chapter:books[c.dataset.group]+' / '+c.dataset.title,heading:s.querySelector('h2').textContent,id:s.id,text:(start?'…':'')+text.slice(start,start+140)+(text.length>start+140?'…':'')})}}}const highlight=text=>{let safe=escape(text);for(const term of terms){const escaped=escape(term).replace(/[.*+?^${}()|[\\]\\\\]/g,'\\\\$&');safe=safe.replace(new RegExp(escaped,'gi'),m=>`<mark>${m}<\/mark>`)}return safe};results.innerHTML=`<p class=\"breadcrumb\">Teacher Manual<span>/<\/span>Search<\/p><h1>Search: ${escape(query)}<\/h1><p class=\"secondary\">${found.length} matching sections across both tabs<\/p>`+(found.length?found.map(f=>`<div class=\"search-result\"><small>${escape(f.chapter)}<\/small><div><a href=\"#${f.id}\">${highlight(f.heading)}<\/a><\/div><p>${highlight(f.text)}<\/p><\/div>`).join(''):'<p class=\"no-results\">No matches found. Try upload, review, regrade, or reports.<\/p>')}\nsearch.addEventListener('input',performSearch);search.addEventListener('keydown',e=>{if(e.key==='Enter'){closeMenu();search.blur();window.scrollTo({top:0,behavior:'instant'})}if(e.key==='Escape'){search.value='';renderChapter();search.blur()}});window.addEventListener('hashchange',renderChapter);document.addEventListener('click',e=>{const a=e.target.closest('a[href^=\"#\"]');if(a&&a.hash===location.hash){e.preventDefault();renderChapter()}});menu.addEventListener('click',()=>{const open=document.body.classList.toggle('nav-open');menu.setAttribute('aria-expanded',String(open));menu.setAttribute('aria-label',open?'Close contents':'Open contents')});$('#shade').addEventListener('click',closeMenu);\nconst dialog=$('#lightbox');document.querySelectorAll('.zoom-image').forEach(b=>b.addEventListener('click',()=>{const im=b.querySelector('img');$('#lightbox-image').src=im.src;$('#lightbox-image').alt=im.alt;$('#lightbox-caption').textContent=im.alt;dialog.showModal()}));$('#lightbox-close').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});\nlet printedDetails=[];window.addEventListener('beforeprint',()=>{printedDetails=[...document.querySelectorAll('details')].filter(d=>!d.open);printedDetails.forEach(d=>d.open=true)});window.addEventListener('afterprint',()=>{printedDetails.forEach(d=>d.open=false)});renderChapter();\n$('#language-toggle').addEventListener('click',()=>window.switchManualLanguage());\n// Keep the fixed header offset accurate when localized actions wrap on small screens.\nconst header=document.querySelector('.topbar');\nconst updateHeader=()=>document.documentElement.style.setProperty('--header',`${header.getBoundingClientRect().height}px`);\nnew ResizeObserver(updateHeader).observe(header);updateHeader();\n})();\n<\/script><\/body><\/html>"};
window.__manualLanguage='zh';
try {
  const siteLanguage=localStorage.getItem('smartai_locale');
  window.__manualLanguage=siteLanguage ? (siteLanguage==='en-US'?'en':'zh') : (localStorage.getItem('smartai-manual-language')==='en'?'en':'zh');
} catch(e) {}
const requestedLanguage=new URLSearchParams(location.search).get('lang');
if(requestedLanguage==='zh'||requestedLanguage==='en')window.__manualLanguage=requestedLanguage;
function saveManualLanguage(){try{localStorage.setItem('smartai-manual-language',window.__manualLanguage);localStorage.setItem('smartai_locale',window.__manualLanguage==='en'?'en-US':'zh-CN')}catch(e){}}
saveManualLanguage();
window.switchManualLanguage=function(){
  window.__manualLanguage=window.__manualLanguage==='zh'?'en':'zh';
  saveManualLanguage();
  const url=new URL(location.href);url.searchParams.set('lang',window.__manualLanguage);location.replace(url.href);
};
setTimeout(()=>{document.open();document.write(window.__manualPages[window.__manualLanguage]);document.close()},0);
