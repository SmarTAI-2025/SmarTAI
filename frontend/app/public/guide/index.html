&a.hash==='#api-providers');if(a.hash==='#'+id&&id!==active.id)a.setAttribute('aria-current','location')});outline.innerHTML=[...active.querySelectorAll('section')].map(s=>`<a href=\"#${s.id}\">${escape(s.querySelector('h2').textContent)}<\/a>`).join('');if(observer)observer.disconnect();observer=new IntersectionObserver(entries=>{for(const e of entries)if(e.isIntersecting){outline.querySelectorAll('a').forEach(a=>a.classList.toggle('active',a.hash===`#${e.target.id}`))}},{rootMargin:'-100px 0px -65% 0px'});active.querySelectorAll('section').forEach(s=>observer.observe(s));closeMenu();requestAnimationFrame(()=>{if(target&&target!==active)target.scrollIntoView();else window.scrollTo({top:0,behavior:'instant'})})}\nfunction performSearch(){const query=search.value.trim();if(!query){renderChapter();return}chapters.forEach(c=>c.hidden=true);document.querySelector('.page-outline').hidden=true;results.hidden=false;const terms=query.toLocaleLowerCase().split(/\\s+/);const found=[];for(const c of chapters){for(const s of c.querySelectorAll('section')){const text=s.textContent.replace(/\\s+/g,' ').trim();const hay=(c.dataset.title+' '+text).toLocaleLowerCase();if(terms.every(t=>hay.includes(t))){const first=text.toLocaleLowerCase().indexOf(terms[0]);const start=Math.max(0,first-30);found.push({chapter:books[c.dataset.group]+' / '+c.dataset.title,heading:s.querySelector('h2').textContent,id:s.id,text:(start?'…':'')+text.slice(start,start+140)+(text.length>start+140?'…':'')})}}}const highlight=text=>{let safe=escape(text);for(const term of terms){const escaped=escape(term).replace(/[.*+?^${}()|[\\]\\\\]/g,'\\\\$&');safe=safe.replace(new RegExp(escaped,'gi'),m=>`<mark>${m}<\/mark>`)}return safe};results.innerHTML=`<p class=\"breadcrumb\">教师使用手册<span>/<\/span>搜索<\/p><h1>搜索“${escape(query)}”<\/h1><p class=\"secondary\">跨两个页签找到 ${found.length} 处相关内容<\/p>`+(found.length?found.map(f=>`<div class=\"search-result\"><small>${escape(f.chapter)}<\/small><div><a href=\"#${f.id}\">${highli 5.4<\/span><span>Search within materials<\/span><\/a><\/li><\/ol><\/li><li data-chapter=\"create\"><a href=\"#create\"><span class=\"num\">6<\/span><span>New tasks and drafts<\/span><\/a><ol class=\"section-nav\" data-parent=\"create\" hidden><li><a href=\"#create-1\"><span class=\"num\">6.1<\/span><span>Enter task information<\/span><\/a><\/li><li><a href=\"#create-2\"><span class=\"num\">6.2<\/span><span>Save drafts, restore work, and save to the task<\/span><\/a><\/li><\/ol><\/li><li data-chapter=\"questions\"><a href=\"#questions\"><span class=\"num\">7<\/span><span>Question and material upload<\/span><\/a><ol class=\"section-nav\" data-parent=\"questions\" hidden><li><a href=\"#questions-1\"><span class=\"num\">7.1<\/span><span>What goes in each of the four material categories<\/span><\/a><\/li><li><a href=\"#questions-2\"><span class=\"num\">7.2<\/span><span>Narrow the recognition scope<\/span><\/a><\/li><li><a href=\"#questions-3\"><span class=\"num\">7.3<\/span><span>Set maximum scores and generation language<\/span><\/a><\/li><li><a href=\"#questions-4\"><span class=\"num\">7.4<\/span><span>Track progress or take over midway<\/span><\/a><\/li><\/ol><\/li><li data-chapter=\"question-review\"><a href=\"#question-review\"><span class=\"num\">8<\/span><span>Review questions and complete materials<\/span><\/a><ol class=\"section-nav\" data-parent=\"question-review\" hidden><li><a href=\"#question-review-1\"><span class=\"num\">8.1<\/span><span>Find questions that need attention in the matrix<\/span><\/a><\/li><li><a href=\"#question-review-2\"><span class=\"num\">8.2<\/span><span>Check maximum scores and grading criteria together<\/span><\/a><\/li><li><a href=\"#question-review-3\"><span class=\"num\">8.3<\/span><span>Three ways to add materials<\/span><\/a><\/li><li><a href=\"#question-review-4\"><span class=\"num\">8.4<\/span><span>Extra checks for programming questions<\/span><\/a><\/li><\/ol><\/li><li data-chapter=\"submissions\"><a href=\"#submissions\"><span class=\"num\">9<\/span><span>Upload and review student submissions<\/span><\/a><ol class=\"section-nav\" data-parent=\"submissions\" hidden><li><a href=\"#submissions-1\"><span class=\"num\">9.1<\/span><span>Organize and upload submissions<\/span><\/a><\/li><li><a href=\"#submissions-2\"><span class=\"num\">9.2<\/span><span>Choose an identity-matching method<\/span><\/a><\/li><li><a href=\"#submissions-3\"><span class=\"num\">9.3<\/span><span>Check identities, answers, and originals<\/span><\/a><\/li><li><a href=\"#submissions-4\"><span class=\"num\">9.4<\/span><span>When recognition is incomplete<\/span><\/a><\/li><\/ol><\/li><li data-chapter=\"grading\"><a href=\"#grading\"><span class=\"num\">10<\/span><span>Configure and run grading<\/span><\/a><ol class=\"section-nav\" data-parent=\"grading\" hidden><li><a href=\"#grading-1\"><span class=\"num\">10.1<\/span><span>Choose models and score aggregation<\/span><\/a><\/li><li><a href=\"#grading-2\"><span class=\"num\">10.2<\/span><span>Scoring, feedback, and materials<\/span><\/a><\/li><li><a href=\"#grading-3\"><span class=\"num\">10.3<\/span><span>Saving starts an automatic countdown<\/span><\/a><\/li><li><a href=\"#grading-4\"><span class=\"num\">10.4<\/span><span>Progress, pause, and resume<\/span><\/a><\/li><\/ol><\/li><li data-chapter=\"review\"><a href=\"#review\"><span class=\"num\">11<\/span><span>Review scores and regrade<\/span><\/a><ol class=\"section-nav\" data-parent=\"review\" hidden><li><a href=\"#review-1\"><span class=\"num\">11.1<\/span><span>Resolve red items first, then check yellow<\/span><\/a><\/li><li><a href=\"#review-2\"><span class=\"num\">11.2<\/span><span>Review and confirm each question<\/span><\/a><\/li><li><a href=\"#review-3\"><span class=\"num\">11.3<\/span><span>Retry failed items or regrade the entire batch<\/span><\/a><\/li><\/ol><\/li><li data-chapter=\"results\"><a href=\"#results\"><span class=\"num\">12<\/span><span>Results analysis and reports<\/span><\/a><ol class=\"section-nav\" data-parent=\"results\" hidden><li><a href=\"#results-1\"><span class=\"num\">12.1<\/span><span>Overview and question analysis<\/span><\/a><\/li><li><a href=\"#results-2\"><span class=\"num\">12.2<\/span><span>Student analysis<\/span><\/a><\/li><li><a href=\"#results-3\"><span class=\"num\">12.3<\/span><span>Ask and visual analysis<\/span><\/a><\/li><li><a href=\"#results-4\"><span class=\"num\">12.4<\/span><span>Generate and download reports<\/span><\/a><\/li><\/ol><\/li><li data-chapter=\"settings\"><a href=\"#settings\"><span class=\"num\">13<\/span><span>Account settings and common issues<\/span><\/a><ol class=\"section-nav\" data-parent=\"settings\" hidden><li><a href=\"#settings-1\"><span class=\"num\">13.1<\/span><span>Interface and storage<\/span><\/a><\/li><li><a href=\"#settings-2\"><span class=\"num\">13.2<\/span><span>A button is unavailable<\/span><\/a><\/li><li><a href=\"#settings-3\"><span class=\"num\">13.3<\/span><span>Model failures, page conflicts, or missing files<\/span><\/a><\/li><\/ol><\/li><\/ol><ol class=\"chapter-nav\" data-group=\"api\" hidden><li data-chapter=\"api-smartai\"><a href=\"#api-smartai\"><span class=\"num\">1<\/span><span>Configure models in SmarTAI<\/span><\/a><\/li><li data-chapter=\"api-providers\"><a href=\"#api-providers\"><span class=\"num\">2<\/span><span>Providers and API access<\/span><\/a><ol class=\"provider-nav\"><li><a href=\"#api-google\"><span class=\"num\">2.1<\/span><span>Google Gemini / Gemma<\/span><\/a><\/li><li><a href=\"#api-openai\"><span class=\"num\">2.2<\/span><span>OpenAI<\/span><\/a><\/li><li><a href=\"#api-claude\"><span class=\"num\">2.3<\/span><span>Anthropic Claude<\/span><\/a><\/li><li><a href=\"#api-deepseek\"><span class=\"num\">2.4<\/span><span>DeepSeek<\/span><\/a><\/li><li><a href=\"#api-glm\"><span class=\"num\">2.5<\/span><span>Zhipu BigModel / GLM<\/span><\/a><\/li><li><a href=\"#api-kimi\"><span class=\"num\">2.6<\/span><span>Kimi / Moonshot<\/span><\/a><\/li><li><a href=\"#api-qwen\"><span class=\"num\">2.7<\/span><span>Alibaba Cloud Model Studio / Qwen<\/span><\/a><\/li><li><a href=\"#api-baidu\"><span class=\"num\">2.8<\/span><span>Baidu Document Parsing Unlimited-OCR<\/span><\/a><\/li><li><a href=\"#api-tencent\"><span class=\"num\">2.9<\/span><span>Tencent Hunyuan / TokenHub<\/span><\/a><\/li><li><a href=\"#api-doubao\"><span class=\"num\">2.10<\/span><span>ByteDance Doubao / Volcano Ark<\/span><\/a><\/li><li><a href=\"#api-minimax\"><span class=\"num\">2.11<\/span><span>MiniMax<\/span><\/a><\/li><\/ol><\/li><li data-chapter=\"api-relay\"><a href=\"#api-relay\"><span class=\"num\">3<\/span><span>School-provided and other relay APIs<\/span><\/a><\/li><\/ol><\/nav><p class=\"sidebar-foot\">Read by chapter or search both tabs.<\/p><\/aside><div class=\"shade\" id=\"shade\"><\/div>\n<main class=\"layout\" id=\"main\"><div class=\"reading-layout\"><div class=\"article\"><article class=\"chapter\" id=\"quickstart\" data-group=\"manual\" data-title=\"Quick start\" data-number=\"1\" tabindex=\"-1\"><p class=\"breadcrumb\">User Manual<span>/<\/span>1 Quick start<\/p><header class=\"chapter-heading\"><div class=\"chapter-number\">Chapter 1<\/div><h1>1 Quick start<\/h1><p class=\"intro\">Start with one assignment: prepare the questions, check student answers, grade and review, then view the results.<\/p><\/header><section id=\"quickstart-1\"><h2>1.1 What you need for your first assignment<\/h2><ul><li>A teacher account and at least one available model.<\/li><li>A question file; reference answers, grading criteria, and programming test materials are optional.<\/li><li>Student submissions: one file per student, with multiple files packaged as a ZIP.<\/li><li>For roster-based matching, prepare a CSV, TSV, or TXT file with “学号” (student ID) and “姓名” (name) column headers.<\/li><\/ul><figure class=\"figure\" style=\"max-width:2000px\"><button type=\"button\" class=\"zoom-image\" aria-label=\"Enlarge: Create a task from the workspace or resume assignments at different stages.\"><img src=\"assets/captures/en/02-workspace.jpg\" alt=\"Create a task from the workspace or resume assignments at different stages.\" width=\"2800\" height=\"2482\" loading=\"lazy\" decoding=\"async\"><\/button><figcaption><span>Figure 1.1a<\/span><span>Create a task from the workspace or resume assignments at different stages.<\/span><small>Click to enlarge<\/small><\/figcaption><\/figure><\/section><section id=\"quickstart-2\"><h2>1.2 Complete a grading cycle<\/h2><ol><li>In “New task,” enter a name and semester, with an optional course and tags.<\/li><li>Upload questions, set the maximum score for each question, and click “Recognize and prepare question materials.”<\/li><li>In the question matrix, check the question text, maximum scores, grading criteria, and reference answers.<\/li><li>Upload student submissions and check student identities and the content for each question.<\/li><li>Select grading models and a scoring method, save, and check the grading summary.<\/li><li>After grading finishes, resolve red items first, then open “Learning analysis and export.”<\/li><\/ol><p class=\"warning\">Once the grading summary passes its checks, a countdown starts and grading begins automatically. To change settings, click “Back to grading settings” before the countdown ends.<\/p><\/section><section id=\"quickstart-3\"><h2>1.3 Remember the two colors<\/h2><p><strong>Red: “Action required”<\/strong> indicates missing items, no valid score, or important issues awaiting confirmation. Resolve these before continuing.<\/p><p><strong>Yellow: “Suggested review”<\/strong> indicates something worth checking but does not prevent you from continuing. Examples include confidence below 0.60, or some experts not finishing when valid scores are already available.<\/p><p class=\"note\">Saving changes and confirming your review are separate steps. Save your edits first, then click confirm.<\/p><\/section><nav class=\"page-nav\" aria-label=\"Chapter navigation\"><a href=\"#account\"><small>Next<\/small>Registration and sign-in<\/a><\/nav><footer class=\"page-foot\"><span>SmarTAI · User Manual<\/span><a href=\"#quickstart\">Back to chapter top ↑<\/a><\/footer><\/article><article class=\"chapter\" id=\"account\" data-group=\"manual\" data-title=\"Registration and sign-in\" data-number=\"2\" tabindex=\"-1\"><p class=\"breadcrumb\">User Manual<span>/<\/span>2 Registration and sign-in<\/p><header class=\"chapter-heading\"><div class=\"chapter-number\">Chapter 2<\/div><h1>2 Registration and sign-in<\/h1><p class=\"intro\">Create a teacher account with your school email, or continue with an existing account.<\/p><\/header><section id=\"account-1\"><h2>2.1 Create a teacher account<\/h2><ol><li>On the sign-in page, click “Register with email verification.”<\/li><li>Enter a username, school email, password, and password confirmation.<\/li><li>Click “Send verification link,” open the email, and complete verification.<\/li><li>After verification, return to the sign-in page and open the workspace.<\/li><\/ol><p class=\"secondary\">Usernames must contain at least 3 characters; passwords must contain 8–128 characters. Verification links expire after 30 minutes. Your account is not created until verification is complete.<\/p><details><summary>Verification email not received<\/summary><div><p>Check your spam folder first. On the email notification page, resend after the countdown finishes. If your email domain is not accepted, check your school email against the instructions on the page.<\/p><\/div><\/details><\/section><section id=\"account-2\"><h2>2.2 Sign in and reset your password<\/h2><p>Choose “Sign in with username” or “Sign in with email,” enter your password, and click “Sign in.” If you forget your password, click “Forgot password” and use the emailed link to set a new one.<\/p><p>The username menu in the upper-right corner provides access to “Account settings,” “Models &amp; BYOK,” and sign-out. If your session expires, sign in again and reopen the task from the workspace or task history.<\/p><figure class=\"figure\" style=\"max-width:560px\"><button type=\"button\" class=\"zoom-image\" aria-label=\"Enlarge: Sign in to the teacher workspace with a username or email.\"><img src=\"assets/captures/en/01-login.jpg\" alt=\"Sign in to the teacher workspace with a username or email.\" width=\"960\" height=\"1400\" loading=\"lazy\" decoding=\"async\"><\/button><figcaption><span>Figure 2.2a<\/span><span>Sign in to the teacher workspace with a username or email.<\/span><small>Click to enlarge<\/small><\/figcaption><\/figure><\/section><nav class=\"page-nav\" aria-label=\"Chapter navigation\"><a href=\"#quickstart\"><small>Previous<\/small>Quick start<\/a><a href=\"#workspace\"><small>Next<\/small>Workspace and task history<\/a><\/nav><footer class=\"page-foot\"><span>SmarTAI · User Manual<\/span><a href=\"#account\">Back to chapter top ↑<\/a><\/footer><\/article><article class=\"chapter\" id=\"workspace\" data-group=\"manual\" data-title=\"Workspace and task history\" data-number=\"3\" tabindex=\"-1\"><p class=\"breadcrumb\">User Manual<span>/<\/span>3 Workspace and task history<\/p><header class=\"chapter-heading\"><div class=\"chapter-number\">Chapter 3<\/div><h1>3 Workspace and task history<\/h1><p class=\"intro\">The workspace helps you decide what to do next; task history helps you find, filter, and resume earlier work.<\/p><\/header><section id=\"workspace-1\"><h2>3.1 Resume tasks from the workspace<\/h2><p>The task list shows courses and tags, the current stage, progress, estimated time, and the next action. Start with tasks that need your attention, then check tasks processing in the background and tasks with results available.<\/p><ul><li>Recognition or grading in progress: open the progress page for updates.<\/li><li>Awaiting review: open the corresponding question, submission, or score matrix.<\/li><li>Paused: use the appropriate resume action or continue manually.<\/li><li>Results available: open review or results analysis.<\/li><\/ul><p class=\"secondary\">When there are too few reliable samples to estimate completion time, “Estimating” is shown. This alone does not mean the task is stuck.<\/p><figure class=\"figure\" style=\"max-width:2000px\"><button type=\"button\" class=\"zoom-image\" aria-label=\"Enlarge: The workspace summarizes task stages and provides actions to continue processing.\"><img src=\"assets/captures/en/02-workspace.jpg\" alt=\"The workspace summarizes task stages and provides actions to continue processing.\" width=\"2800\" height=\"2482\" loading=\"lazy\" decoding=\"async\"><\/button><figcaption><span>Figure 3.1a<\/span><span>The workspace summarizes task stages and provides actions to continue processing.<\/span><small>Click to enlarge<\/small><\/figcaption><\/figure><\/section><section id=\"workspace-2\"><h2>3.2 Find tasks in task history<\/h2><p>“Task history” has sections for “Assignment grading,” “Textbook recognition,” and “Saved drafts.” Search by name or other criteria, combine semester, course, tag, or status filters, then open a task to return to its current stage.<\/p><p>If you cannot find a task, clear the filters first. Courses and tags organize tasks; you do not need to recreate the same course for every assignment.<\/p><p>You can also use “SmarTAI smart task filtering,” for example, “Unfinished spring calculus grading tasks.” Check the generated conditions, remove individual conditions, or clear all smart conditions. If a request is ambiguous, first confirm a choice from the actual available options. Standard search and filters remain available when smart filtering is temporarily unavailable.<\/p><figure class=\"figure\" style=\"max-width:2000px\"><button type=\"button\" class=\"zoom-image\" aria-label=\"Enlarge: Task history shows progress by stage, with search and links back to the relevant processing pages.\"><img src=\"assets/captures/en/03-history.jpg\" alt=\"Task history shows progress by stage, with search and links back to the relevant processing pages.\" width=\"2800\" height=\"2000\" loading=\"lazy\" decoding=\"async\"><\/button><figcaption><span>Figure 3.2a<\/span><span>Task history shows progress by stage, with search and links back to the relevant processing pages.<\/span><small>Click to enlarge<\/small><\/figcaption><\/figure><\/section><section id=\"workspace-3\"><h2>3.3 Organize task information<\/h2><p>Use the task information editor to change the task name, semester, course, and tags. If you are told that another page has changed the content, check the latest content before saving again to avoid overwriting newer changes with an older page.<\/p><p class=\"warning\">Before deleting, check the scope of impact listed on the page. Long-term course library materials are managed separately from task originals.<\/p><\/section><nav class=\"page-nav\" aria-label=\"Chapter navigation\"><a href=\"#account\"><small>Previous<\/small>Registration and sign-in<\/a><a href=\"#models\"><small>Next<\/small>Models &amp; BYOK<\/a><\/nav><footer class=\"page-foot\"><span>SmarTAI · User Manual<\/span><a href=\"#workspace\">Back to chapter top ↑<\/a><\/footer><\/article><article class=\"chapter\" id=\"models\" data-group=\"manual\" data-title=\"Models &amp; BYOK\" data-number=\"4\" tabindex=\"-1\"><p class=\"breadcrumb\">User Manual<span>/<\/span>4 Models &amp; BYOK<\/p><header class=\"chapter-heading\"><div class=\"chapter-number\">Chapter 4<\/div><h1>4 Models &amp; BYOK<\/h1><p class=\"intro\">BYOK means using your own model API configuration. Configure it once, then select it for different tasks and stages.<\/p><\/header><section id=\"models-1\"><h2>4.1 Add and enable a model<\/h2><ol><li>Open the username menu in the upper-right corner → “Models &amp; BYOK” → “Add model configuration.”<\/li><li>Select a provider and enter the model name and API key. The configuration name is optional.<\/li><li>Normally, keep the default API Base URL. For a relay service, use the URL and model ID from the relay provider’s documentation.<\/li><li>Save and enable the configuration, then select the model on the task page.<\/li><\/ol><p class=\"note\">Saving a configuration does not call the model. Text and image tests are optional troubleshooting steps, not prerequisites for starting a task.<\/p><figure class=\"figure\" style=\"max-width:560px\"><button type=\"button\" class=\"zoom-image\" aria-label=\"Enlarge: When adding a model, enter the provider, model name, and API configuration.\"><img src=\"assets/captures/en/04b-model-dialog.jpg\" alt=\"When adding a model, enter the provider, model name, and API configuration.\" width=\"1120\" height=\"1624\" loading=\"lazy\" decoding=\"async\"><\/button><figcaption><span>Figure 4.1a<\/span><span>When adding a model, enter the provider, model name, and API configuration.<\/span><small>Click to enlarge<\/small><\/figcaption><\/figure><details><summary>Base URL, protocol, and RPM<\/summary><div><p>Keep prefixes such as /v1 in the Base URL; do not append operation paths such as /chat/completions. Normally, leave the API protocol set to “Follow provider,” changing it only when the relay provider explicitly requires this. Leaving RPM blank or entering 0 applies no additional rate limit. The system adjusts concurrency automatically and queues requests when resources are limited.<\/p><\/div><\/details><\/section><section id=\"models-2\"><h2>4.2 Test and manage configurations<\/h2><p>“Verify (optional)” tests text connectivity; “Verify vision capability” tests image input. Requests are sent only after you confirm the test prompt, and tests may consume provider quota. If a test fails, click the reason to expand the full explanation.<\/p><ul><li>“Could not confirm this time” means this test was inconclusive. It does not establish that the model does not support images.<\/li><li>When editing a configuration, leave API key blank to retain the existing key.<\/li><li>You can set a default, enable, disable, or delete configurations. Choose another default before disabling or deleting the current default model.<\/li><li>You can use different models for question recognition, submission recognition, and grading.<\/li><\/ul><p class=\"secondary\">“Enabled” means the model can be selected, not that the provider is currently online. Check balances, usage, and available quota using the “Official provider links” at the bottom of the page.<\/p><figure class=\"figure\" style=\"max-width:2000px\"><button type=\"button\" class=\"zoom-image\" aria-label=\"Enlarge: Model configurations and Baidu document parsing credentials are managed separately.\"><img src=\"assets/captures/en/04-byok.jpg\" alt=\"Model configurations and Baidu document parsing credentials are managed separately.\" width=\"2800\" height=\"1732\" loading=\"lazy\" decoding=\"async\"><\/button><figcaption><span>Figure 4.2a<\/span><span>Model configurations and Baidu document parsing credentials are managed separately.<\/span><small>Click to enlarge<\/small><\/figcaption><\/figure><\/section><section id=\"models-3\"><h2>4.3 Choosing and using LLM and OCR services<\/h2><p>Large language models and OCR services serve different purposes: LLMs interpret questions, generate reference materials, and grade assignments. Image-capable LLMs can also recognize images, scans, and handwritten answers. OCR services extract text and structure from documents; grading after recognition still requires a grading model. Choose based on file type, recognition quality, and service quota, and check the recognized results.<\/p><p>For an LLM API, enter the provider, model name, API Key, and API base address in “Add model configuration.” For OCR, use the credential configuration area for that service. For example, Baidu document parsing has a separate API Key / Secret Key configuration area; credentials can be validated after saving. Service permissions and quotas are checked during actual OCR tasks.<\/p><p>Provider links cover Google, OpenAI, Anthropic, DeepSeek, Zhipu, Kimi, Qwen, Tencent TokenHub, Doubao, MiniMax, and Baidu OCR. Find the provider at the bottom of the page, click “Keys” to apply in its official console, then return to the relevant configuration area. Check model names under the provider’s “Documentation”; check free quota, balances, and billing under “Usage.” For relay services, use the Key, Base URL, and model ID supplied by the relay provider, and contact that provider first if there are problems.<\/p><p class=\"note\">Need field-by-field instructions or help applying for a key? See <a href=\"#api-smartai\">Model configuration steps<\/a>, <a href=\"#api-providers\">Application guides for 11 providers<\/a>, or <a href=\"#api-relay\">School and other relay APIs<\/a>.<\/p><figure class=\"figure\" style=\"max-width:2000px\"><button type=\"button\" class=\"zoom-image\" aria-label=\"Enlarge: Official provider links lead to key applications, usage, and documentation.\"><img src=\"assets/captures/en/04c-provider-links.jpg\" alt=\"Official provider links lead to key applications, usage, and documentation.\" width=\"2600\" height=\"342\" loading=\"lazy\" decoding=\"async\"><\/button><figcaption><span>Figure 4.3a<\/span><span>Official provider links lead to key applications, usage, and documentation.<\/span><small>Click to enlarge<\/small><\/figcaption><\/figure><\/section><nav class=\"page-nav\" aria-label=\"Chapter navigation\"><a href=\"#workspace\"><small>Previous<\/small>Workspace and task history<\/a><a href=\"#library\"><small>Next<\/small>Course library<\/a><\/nav><footer class=\"page-foot\"><span>SmarTAI · User Manual<\/span><a href=\"#models\">Back to chapter top ↑<\/a><\/footer><\/article><article class=\"chapter\" id=\"library\" data-group=\"manual\" data-title=\"Course library\" data-number=\"5\" tabindex=\"-1\"><p class=\"breadcrumb\">User Manual<span>/<\/span>5 Course library<\/p><header class=\"chapter-heading\"><div class=\"chapter-number\">Chapter 5<\/div><h1>5 Course library<\/h1><p class=\"intro\">Keep reusable textbooks, lecture notes, answers, and grading criteria together so you can select them directly next time.<\/p><\/header><section id=\"library-1\"><h2>5.1 Upload and categorize materials<\/h2><ol><li>Open “Course library” and click “Upload materials.”<\/li><li>Select PDF, TXT, or Markdown files.<\/li><li>Optionally select a course, group, and material type, add tags, and upload.<\/li><li>Check parsing progress and confirm that the materials are available.<\/li><\/ol><p>Material types include textbooks, exercise answers, lecture notes, grading criteria, and other materials. Use “New group” to keep materials for the same chapter or teaching unit together.<\/p><figure class=\"figure\" style=\"max-width:563px\"><button type=\"button\" class=\"zoom-image\" aria-label=\"Enlarge: Choose a course, group, and material type when uploading; extracting existing text only is also available.\"><img src=\"assets/captures/en/05b-library-upload.jpg\" alt=\"Choose a course, group, and material type when uploading; extracting existing text only is also available.\" width=\"1120\" height=\"990\" loading=\"lazy\" decoding=\"async\"><\/button><figcaption><span>Figure 5.1a<\/span><span>Choose a course, group, and material type when uploading; extracting existing text only is also available.<\/span><small>Click to enlarge<\/small><\/figcaption><\/figure><details><summary>When to choose “Extract existing text only”<\/summary><div><p>If a file has directly readable text and does not need model-based parsing, choose “Extract existing text only (no model calls).” Scanned pages and images require appropriate recognition capabilities. Use the material’s page status and available content to confirm whether it was successfully added to the library.<\/p><\/div><\/details><\/section><section id=\"library-2\"><h2>5.2 Find, reference, and manage materials<\/h2><p>Use the search at the top to find filenames, tags, or groups, and filter by type. When uploading questions, you can select sources from the library. In grading settings, you can also select textbooks, lecture notes, and other supplementary context.<\/p><p>Material management lets you change names, courses, groups, and tags without rewriting parsed text. Check task-reference warnings before deleting. Deleting materials also removes their reference associations.<\/p><figure class=\"figure\" style=\"max-width:2000px\"><button type=\"button\" class=\"zoom-image\" aria-label=\"Enlarge: Upload files to the course library and find them by type.\"><img src=\"assets/captures/en/05-library.jpg\" alt=\"Upload files to the course library and find them by type.\" width=\"2800\" height=\"1376\" loading=\"lazy\" decoding=\"async\"><\/button><figcaption><span>Figure 5.2a<\/span><span>Upload files to the course library and find them by type.<\/span><small>Click to enlarge<\/small><\/figcaption><\/figure><\/section><section id=\"library-3\"><h2>5.3 When parsing is incomplete<\/h2><p>Open a material’s recognition status to see failed or unfinished pages and the reasons. If needed, choose a retry model to read the remaining pages. Successfully processed pages are retained; changing the retry model does not require reading them again.<\/p><p class=\"note\">The course library uses separate storage. Saved library content is retained long-term and is not deleted with grading tasks. Space from deleted materials is reclaimed in the background.<\/p><\/section><section id=\"library-4\"><h2>5.4 Search within materials<\/h2><p>Filename search finds files; “Search material content” below it finds passages in the text. Narrow the material scope to no more than 20 files, enter keywords or a question, then open a result’s source reference to view the relevant location.<\/p><p>The default “Local search” does not need model assistance. “Model-assisted” search can help interpret the query; only the query is sent, not the textbook, and model charges may apply. Local search results remain available if assistance fails. The task materials area in grading settings provides the same search entry point.<\/p><\/section><nav class=\"page-nav\" aria-label=\"Chapter navigation\"><a href=\"#models\"><small>Previous<\/small>Models &amp; BYOK<\/a><a href=\"#create\"><small>Next<\/small>New tasks and drafts<\/a><\/nav><footer class=\"page-foot\"><span>SmarTAI · User Manual<\/span><a href=\"#library\">Back to chapter top ↑<\/a><\/footer><\/article><article class=\"chapter\" id=\"create\" data-group=\"manual\" data-title=\"New tasks and drafts\" data-number=\"6\" tabindex=\"-1\"><p class=\"breadcrumb\">User Manual<span>/<\/span>6 New tasks and drafts<\/p><header class=\"chapter-heading\"><div class=\"chapter-number\">Chapter 6<\/div><h1>6 New tasks and drafts<\/h1><p class=\"intro\">Give the assignment a clear name, then prepare the questions.<\/p><\/header><section id=\"create-1\"><h2>6.1 Enter task information<\/h2><p>Click “New task,” enter a task name, and select a semester. Courses and tags are optional: search for existing ones, or create and select them using the controls on the page. Continue to “Question and material upload.”<\/p><p class=\"secondary\">For example: task name “Calculus · Chapter 3 Assignment,” course “Calculus,” tag “Chapter 3.” If you have typed a course or tag but have not selected or created it yet, confirm it first.<\/p><figure class=\"figure\" style=\"max-width:2000px\"><button type=\"button\" class=\"zoom-image\" aria-label=\"Enlarge: Enter the task name, semester, and course, then create the task or save a draft.\"><img src=\"assets/captures/en/06-new-task.jpg\" alt=\"Enter the task name, semester, and course, then create the task or save a draft.\" width=\"2800\" height=\"2000\" loading=\"lazy\" decoding=\"async\"><\/button><figcaption><span>Figure 6.1a<\/span><span>Enter the task name, semester, and course, then create the task or save a draft.<\/span><small>Click to enlarge<\/small><\/figcaption><\/figure><\/section><section id=\"create-2\"><h2>6.2 Save drafts, restore work, and save to the task<\/h2><p>When offered “Save draft,” you can retain your current input and restore it later from “Task history → Saved drafts” or the original page. After editing question text, reference answers, or other content, click “Save” in each area to write the changes to the task.<\/p><p class=\"warning\">A filename retained in a draft does not necessarily mean the file is still available for upload. Reselect files marked “Reselection required.” If you see “Uploaded files can still be used,” continue directly.<\/p><p>If a draft conflicts with server content, review the differences, then explicitly restore or delete the old draft. When editing the same task in multiple pages, close older pages first.<\/p><\/section><nav class=\"page-nav\" aria-label=\"Chapter navigation\"><a href=\"#library\"><small>Previous<\/small>Course library<\/a><a href=\"#questions\"><small>Next<\/small>Question and material upload<\/a><\/nav><footer class=\"page-foot\"><span>SmarTAI · User Manual<\/span><a href=\"#create\">Back to chapter top ↑<\/a><\/footer><\/article><article class=\"chapter\" id=\"questions\" data-group=\"manual\" data-title=\"Question and material upload\" data-number=\"7\" tabindex=\"-1\"><p class=\"breadcrumb\">User Manual<span>/<\/span>7 Question and material upload<\/p><header class=\"chapter-heading\"><div class=\"chapter-number\">Chapter 7<\/div><h1>7 Question and material upload<\/h1><p class=\"intro\">Only a question source is required; you can upload the other materials or have SmarTAI prepare them.<\/p><\/header><section id=\"questions-1\"><h2>7.1 What goes in each of the four material categories<\/h2><ul><li><strong>Questions (required)<\/strong>: complete question text, conditions, and figures or tables; upload files or select from the course library.<\/li><li><strong>Reference answers (optional)<\/strong>: final answers alone are acceptable; a generative model can add solution steps for you to review.<\/li><li><strong>Grading criteria (optional)<\/strong>: upload files, select from the library, or describe them in natural language.<\/li><li><strong>Test cases (optional)<\/strong>: for programming questions only; may include inputs, expected outputs, explanations, and hidden tests.<\/li><\/ul><p>You can add multiple materials to each category. With a generative model, missing reference answers and grading criteria are generated during unified preparation and remain editable question by question afterward. If you only use Baidu OCR to read materials, fill gaps manually during review or select a generative model to complete them.<\/p><p class=\"secondary\">For questions and general materials, use the PDF, TXT, Markdown, and image formats listed on the page. Programming test materials accept PDF, TXT, Markdown, and JSON, but not images.<\/p><figure class=\"figure\" style=\"max-width:2000px\"><button type=\"button\" class=\"zoom-image\" aria-label=\"Enlarge: Upload the four question-material categories separately; a question file is required.\"><img src=\"assets/captures/en/07-question-upload.jpg\" alt=\"Upload the four question-material categories separately; a question file is required.\" width=\"2800\" height=\"2324\" loading=\"lazy\" decoding=\"async\"><\/button><figcaption><span>Figure 7.1a<\/span><span>Upload the four question-material categories separately; a question file is required.<\/span><small>Click to enlarge<\/small><\/figcaption><\/figure><\/section><section id=\"questions-2\"><h2>7.2 Narrow the recognition scope<\/h2><p>“Already organized by question” suits assignment files with clear question numbers; “Extract from source text” suits textbooks and long documents. Specify page numbers, target question numbers, and additional instructions as needed to avoid adding all exercises from an entire textbook.<\/p><ul><li>Use actual PDF page positions, such as 3-5, 8, rather than printed book page numbers.<\/li><li>Question numbers can be 1.1.5, 1.2.3; a range within the same section can be written as 1.1.5-1.1.7.<\/li><li>Put instructions such as “Chapter 3 exercises; retain figures and tables” in additional instructions.<\/li><\/ul><p>When describing grading criteria in natural language, choose “By question” or “Overall rules.” For question-specific descriptions, clearly state question numbers. Overall rules are organized into scoring steps using each question’s reference answer.<\/p><\/section><section id=\"questions-3\"><h2>7.3 Set maximum scores and generation language<\/h2><p>Under “Set question maximum scores,” enter a uniform value, or enable “Different maximum scores per question” and describe the scores by question number. For example: “Questions 1–3: 5 points each; Question 4: 15 points.”<\/p><p class=\"note\">Questions without an explicit setting or a matching rule temporarily default to 10 points, with a reminder to check. After recognition, verify maximum scores in question details. Model grading uses each question’s saved maximum score.<\/p><p>Choose Chinese or English as the generation language, select a “Question recognition model,” then click “Recognize and prepare question materials.” The chosen language is retained for material generation, supplementary generation, and retries. Changing the interface language does not overwrite it.<\/p><figure class=\"figure\" style=\"max-width:2000px\"><button type=\"button\" class=\"zoom-image\" aria-label=\"Enlarge: Choose the recognition model and generation language, then prepare question materials.\"><img src=\"assets/captures/en/07b-recognition-options.jpg\" alt=\"Choose the recognition model and generation language, then prepare question materials.\" width=\"1880\" height=\"686\" loading=\"lazy\" decoding=\"async\"><\/button><figcaption><span>Figure 7.3a<\/span><span>Choose the recognition model and generation language, then prepare question materials.<\/span><small>Click to enlarge<\/small><\/figcaption><\/figure><\/section><section id=\"questions-4\"><h2>7.4 Track progress or take over midway<\/h2><p>The progress page shows completion counts, percentages, and recognition activity. Waiting for capacity, waiting for a response, and retrying are shown separately. You can return to the workspace and check again later.<\/p><p>After a pause or failure, follow the prompts to retry or “Continue manually.” Manual takeover opens the original question matrix and retains recognized content and available originals. If the total number of questions is unknown, set the complete count first, then fill in each question.<\/p><p class=\"warning\">If there are failed pages, unread pages, or missing questions, read them again or check manually first. Unread content must not be treated as containing no questions. If warned that a previous request may already have been billed, check the warning before resubmitting.<\/p><details><summary>Usage when continuing manually<\/summary><div><p class=\"secondary\">If only recognized text is available, the system may first use a model to organize it, consuming quota. The original review matrix opens once this step finishes.<\/p><\/div><\/details><\/section><nav class=\"page-nav\" aria-label=\"Chapter navigation\"><a href=\"#create\"><small>Previous<\/small>New tasks and drafts<\/a><a href=\"#question-review\"><small>Next<\/small>Review questions and complete materials<\/a><\/nav><footer class=\"page-foot\"><span>SmarTAI · User Manual<\/span><a href=\"#questions\">Back to chapter top ↑<\/a><\/footer><\/article><article class=\"chapter\" id=\"question-review\" data-group=\"manual\" data-title=\"Review questions and complete materials\" data-number=\"8\" tabindex=\"-1\"><p class=\"breadcrumb\">User Manual<span>/<\/span>8 Review questions and complete materials<\/p><header class=\"chapter-heading\"><div class=\"chapter-number\">Chapter 8<\/div><h1>8 Review questions and complete materials<\/h1><p class=\"intro\">Check questions and point values first, then confirm reference answers, grading criteria, and programming test materials.<\/p><\/header><section id=\"question-review-1\"><h2>8.1 Find questions that need attention in the matrix<\/h2><p>The question overview shows preparation status by question, with search, filters, and detail views. Open red “Action required” items first, then yellow recommendations. You can add question rows or remove rows that do not belong to this assignment from the current scope.<\/p><p>In details, compare question text, reference answers, grading criteria, and test materials against the originals. Edit and save each content area separately. Confirmation and question-navigation buttons support continuous question-by-question review.<\/p><p class=\"note\">Material text may be locked at later stages, while browsing and review confirmation remain available. To make changes, first use the task’s back or redo action.<\/p><p>In the original-file preview, PDFs support paging, zoom, and page navigation; images can be viewed directly for comparison. For formats such as TXT without a preview, follow the page instructions. A missing preview does not mean recognized content is lost.<\/p><figure class=\"figure\" style=\"max-width:2000px\"><button type=\"button\" class=\"zoom-image\" aria-label=\"Enlarge: The question matrix summarizes question text, reference answers, grading criteria, and review status.\"><img src=\"assets/captures/en/09-question-review.jpg\" alt=\"The question matrix summarizes question text, reference answers, grading criteria, and review status.\" width=\"2800\" height=\"2000\" loading=\"lazy\" decoding=\"async\"><\/button><figcaption><span>Figure 8.1a<\/span><span>The question matrix summarizes question text, reference answers, grading criteria, and review status.<\/span><small>Click to enlarge<\/small><\/figcaption><\/figure><\/section><section id=\"question-review-2\"><h2>8.2 Check maximum scores and grading criteria together<\/h2><p>You can edit “Maximum score and grading criteria for this question” together. Maximum scores must be positive numbers from 0.01–10000, with no more than two decimal places. If criteria explicitly assign points to subquestions, those subquestions still belong to the same main question, and their points must add up to its maximum score.<\/p><p>If no absolute component scores are specified, use percentages or free-text grading criteria, for example, “Derivation: 60%; conclusion: 40%.” Generated process-based scoring is organized by the corresponding steps. For objective questions, check the applicable result-based rules.<\/p><p class=\"warning\">Fix missing question text, missing grading criteria, or conflicting component scores before confirming. Bulk confirmation cannot bypass genuinely missing items.<\/p><figure class=\"figure\" style=\"max-width:2000px\"><button type=\"button\" class=\"zoom-image\" aria-label=\"Enlarge: Check question text, reference answers, maximum scores, and grading criteria question by question.\"><img src=\"assets/captures/en/10-question-detail.jpg\" alt=\"Check question text, reference answers, maximum scores, and grading criteria question by question.\" width=\"2152\" height=\"1904\" loading=\"lazy\" decoding=\"async\"><\/button><figcaption><span>Figure 8.2a<\/span><span>Check question text, reference answers, maximum scores, and grading criteria question by question.<\/span><small>Click to enlarge<\/small><\/figcaption><\/figure><\/section><section id=\"question-review-3\"><h2>8.3 Three ways to add materials<\/h2><ul><li><strong>Edit directly<\/strong>: for small revisions, edit question details and save.<\/li><li><strong>Bulk import materials<\/strong>: choose grading criteria, reference answers, or test cases, and import from the library or new files. Check “Clear match,” “Possible match,” and “Conflict,” then click “Apply confirmed matches.” Overwriting existing content requires an explicit selection.<\/li><li><strong>SmarTAI complete missing items<\/strong>: review the missing-item list, deselect anything you do not want generated, then click “Confirm and start generating.” Only gaps are filled; existing content is not overwritten.<\/li><\/ul><p class=\"secondary\">The completion precheck does not call a model. After a generation failure, you can reselect items that are still missing or enter them manually. Missing reference answers generally prompt a recommended review; this does not mean grading criteria can be left blank.<\/p><\/section><section id=\"question-review-4\"><h2>8.4 Extra checks for programming questions<\/h2><p>Check the sample correct code, execution mode, each test input, expected output, and explanation. Function-mode and standard-input-mode materials use their corresponding structures. Expand the full set of cases before reviewing; do not check only the first one.<\/p><p>An empty string can be a valid test value and is different from a missing field. The page distinguishes “Public examples” from “Hidden tests.” Click “Edit” to change titles, inputs, expected outputs, explanations, and public/hidden types, or to add and remove cases. Then click “Save test cases.” Check source labels to distinguish generated content, uploaded content, and teacher confirmation status.<\/p><\/section><nav class=\"page-nav\" aria-label=\"Chapter navigation\"><a href=\"#questions\"><small>Previous<\/small>Question and material upload<\/a><a href=\"#submissions\"><small>Next<\/small>Upload and review student submissions<\/a><\/nav><footer class=\"page-foot\"><span>SmarTAI · User Manual<\/span><a href=\"#question-review\">Back to chapter top ↑<\/a><\/footer><\/article><article class=\"chapter\" id=\"submissions\" data-group=\"manual\" data-title=\"Upload and review student submissions\" data-number=\"9\" tabindex=\"-1\"><p class=\"breadcrumb\">User Manual<span>/<\/span>9 Upload and review student submissions<\/p><header class=\"chapter-heading\"><div class=\"chapter-number\">Chapter 9<\/div><h1>9 Upload and review student submissions<\/h1><p class=\"intro\">Match each submission to the right student, then confirm the recognized content for every question.<\/p><\/header><section id=\"submissions-1\"><h2>9.1 Organize and upload submissions<\/h2><p>Use one file per student and package multiple files as a ZIP. If a single PDF contains the whole class’s answers, split it by student first.<\/p><p>Click “Choose files” or drag files in, then select a submission recognition model. Supported formats include PDF, TXT, Markdown, CSV, JPG, PNG, WebP, and supported archives. Images and scanned PDFs use OCR.<\/p><p class=\"warning\">If submissions already exist, uploading again replaces the current recognized content and requires existing grading results to be regenerated. To keep the old task and grade another assignment, create a new task.<\/p><\/section><section id=\"submissions-2\"><h2>9.2 Choose an identity-matching method<\/h2><ul><li><strong>Identify student IDs from filenames<\/strong>: filenames take priority, with information inside the files used as a supplement. Before uploading, use clear student IDs and names in filenames.<\/li><li><strong>Import a roster<\/strong>: upload a CSV, TSV, or TXT with “学号” (student ID) and “姓名” (name) headers. Submissions that cannot be matched uniquely are sent for review.<\/li><li><strong>Correct manually<\/strong>: possible identities are recognized first, and every student requires manual verification.<\/li><\/ul><p>After choosing, click “Start recognizing submissions.” Roster mode cannot start without a roster. If you switch methods, verify identities using the new method.<\/p><figure class=\"figure\" style=\"max-width:2000px\"><button type=\"button\" class=\"zoom-image\" aria-label=\"Enlarge: Choose the recognition model and student identity-matching method when uploading submissions.\"><img src=\"assets/captures/en/13-submission-upload.jpg\" alt=\"Choose the recognition model and student identity-matching method when uploading submissions.\" width=\"2800\" height=\"2062\" loading=\"lazy\" decoding=\"async\"><\/button><figcaption><span>Figure 9.2a<\/span><span>Choose the recognition model and student identity-matching method when uploading submissions.<\/span><small>Click to enlarge<\/small><\/figcaption><\/figure><\/section><section id=\"submissions-3\"><h2>9.3 Check identities, answers, and originals<\/h2><p>In the student submission matrix, check student rows and question statuses. Open student details and compare identities and answers against the originals. You can add or remove student rows in the current scope. During manual takeover, if the student count is unknown, enter the full count first.<\/p><p>Resolve name, student ID, and identity conflicts, as well as missing expected answer records. If content is correct but still marked as awaiting confirmation, retain its value and explicitly confirm it.<\/p><p class=\"warning\">You can confirm a blank when the student genuinely left the question unanswered. A blank caused by recognition failure must not be treated directly as an unanswered question. Retry, enter the content manually, or check the original and explicitly confirm the blank.<\/p><figure class=\"figure\" style=\"max-width:2000px\"><button type=\"button\" class=\"zoom-image\" aria-label=\"Enlarge: Review answers by student and question; items requiring attention are grouped below.\"><img src=\"assets/captures/en/14-submission-review.jpg\" alt=\"Review answers by student and question; items requiring attention are grouped below.\" width=\"2800\" height=\"2000\" loading=\"lazy\" decoding=\"async\"><\/button><figcaption><span>Figure 9.3a<\/span><span>Review answers by student and question; items requiring attention are grouped below.<\/span><small>Click to enlarge<\/small><\/figcaption><\/figure><figure class=\"figure\" style=\"max-width:2000px\"><button type=\"button\" class=\"zoom-image\" aria-label=\"Enlarge: Open a specific answer to check genuine blanks and pending confirmation status.\"><img src=\"assets/captures/en/15-answer-detail.jpg\" alt=\"Open a specific answer to check genuine blanks and pending confirmation status.\" width=\"2120\" height=\"796\" loading=\"lazy\" decoding=\"async\"><\/button><figcaption><span>Figure 9.3b<\/span><span>Open a specific answer to check genuine blanks and pending confirmation status.<\/span><small>Click to enlarge<\/small><\/figcaption><\/figure><\/section><section id=\"submissions-4\"><h2>9.4 When recognition is incomplete<\/h2><p>Check successful, failed, and unread pages for each file. After pausing, you can resume recognition or continue manually; existing answers, identities, and saved fragments are retained. When retrying with the original file and model, the system reuses successful pages where possible and rereads failed pages.<\/p><p>If only the filename remains and no reusable file is available, select it again. If “Checking” is shown, wait for the check to finish. If the check fails, retry the check first. Resolve red issues before proceeding to grading settings.<\/p><details><summary>Usage when continuing manually<\/summary><div><p class=\"secondary\">If only recognized text is available, the system may first use a model to organize it, consuming quota. The original review matrix opens once this step finishes.<\/p><\/div><\/details><\/section><nav class=\"page-nav\" aria-label=\"Chapter navigation\"><a href=\"#question-review\"><small>Previous<\/small>Review questions and complete materials<\/a><a href=\"#grading\"><small>Next<\/small>Configure and run grading<\/a><\/nav><footer class=\"page-foot\"><span>SmarTAI · User Manual<\/span><a href=\"#submissions\">Back to chapter top ↑<\/a><\/footer><\/article><article class=\"chapter\" id=\"grading\" data-group=\"manual\" data-title=\"Configure and run grading\" data-number=\"10\" tabindex=\"-1\"><p class=\"breadcrumb\">User Manual<span>/<\/span>10 Configure and run grading<\/p><header class=\"chapter-heading\"><div class=\"chapter-number\">Chapter 10<\/div><h1>10 Configure and run grading<\/h1><p class=\"intro\">Choose models, a scoring method, and a feedback style for this task, then check the summary and begin grading.<\/p><\/header><section id=\"grading-1\"><h2>10.1 Choose models and score aggregation<\/h2><p>Select at least one enabled model. Selections here apply only to this task and do not change global enabled states in “Models &amp; BYOK.”<\/p><ul><li><strong>Single-model grading<\/strong>: calls only the selected model.<\/li><li><strong>Weighted average<\/strong>: by default, combines valid scores using confidence weights. You can change this to custom positive ratios, such as 1:2.<\/li><li><strong>Combined review<\/strong>: the lead model synthesizes comments. Scores still use the configured weights, and additional model calls are required.<\/li><\/ul><p class=\"secondary\">Failed experts are excluded from score aggregation, and the remaining weights are renormalized. If no valid confidence values are available, an equally weighted average is used. Final AI scores retain one decimal place.<\/p><figure class=\"figure\" style=\"max-width:2000px\"><button type=\"button\" class=\"zoom-image\" aria-label=\"Enlarge: Select grading models and configure score aggregation and weights.\"><img src=\"assets/captures/en/16-grading-setup.jpg\" alt=\"Select grading models and configure score aggregation and weights.\" width=\"2800\" height=\"3194\" loading=\"lazy\" decoding=\"async\"><\/button><figcaption><span>Figure 10.1a<\/span><span>Select grading models and configure score aggregation and weights.<\/span><small>Click to enlarge<\/small><\/figcaption><\/figure><\/section><section id=\"grading-2\"><h2>10.2 Scoring, feedback, and materials<\/h2><p>Choose grading strictness and whether to allow partial credit. Advanced settings let you adjust comment tone, length, language, improvement suggestions, the number of samples for a single model, and grading instructions.<\/p><p>Optionally select textbooks, lecture notes, or background materials as supplementary context, up to 20 task materials. If you choose “Do not use task materials,” confirmed question text, reference answers, and grading criteria for individual questions are still used.<\/p><p class=\"note\">Multiple sampling applies only to a single model configured with your own credentials and increases calls. When multiple models are selected, each runs once. If platform-shared models are available, they must be used alone with a fixed single sample.<\/p><figure class=\"figure\" style=\"max-width:2000px\"><button type=\"button\" class=\"zoom-image\" aria-label=\"Enlarge: Scoring and advanced settings bring together strictness, feedback, and grading instructions.\"><img src=\"assets/captures/en/16b-grading-advanced.jpg\" alt=\"Scoring and advanced settings bring together strictness, feedback, and grading instructions.\" width=\"2376\" height=\"1634\" loading=\"lazy\" decoding=\"async\"><\/button><figcaption><span>Figure 10.2a<\/span><span>Scoring and advanced settings bring together strictness, feedback, and grading instructions.<\/span><small>Click to enlarge<\/small><\/figcaption><\/figure><\/section><section id=\"grading-3\"><h2>10.3 Saving starts an automatic countdown<\/h2><p>Click “Save and view grading summary” and check question and student counts, grading criteria, reference answers, expert selection, and scoring strategy. Once checks pass, a countdown starts automatically. You can also click “Start grading now.” To make changes, click “Back to grading settings.”<\/p><p>If red issues remain, the summary provides links to questions, submissions, or model settings. Resolve them, then save the settings again. After a pause or failure, saving again starts a new summary flow even if the configuration is unchanged.<\/p><figure class=\"figure\" style=\"max-width:2000px\"><button type=\"button\" class=\"zoom-image\" aria-label=\"Enlarge: The grading summary shows the automatic-start countdown, task overview, and scoring strategy.\"><img src=\"assets/captures/en/17-grading-preflight.jpg\" alt=\"The grading summary shows the automatic-start countdown, task overview, and scoring strategy.\" width=\"2800\" height=\"2072\" loading=\"lazy\" decoding=\"async\"><\/button><figcaption><span>Figure 10.3a<\/span><span>The grading summary shows the automatic-start countdown, task overview, and scoring strategy.<\/span><small>Click to enlarge<\/small><\/figcaption><\/figure><\/section><section id=\"grading-4\"><h2>10.4 Progress, pause, and resume<\/h2><p>The progress page shows each model’s completed work, waiting for capacity, waiting for responses, and retries, along with saved AI work and aggregated student-question results. Expand the activity log for details. You can leave the page while processing continues in the background.<\/p><p>After pausing, resume unfinished work or “Continue manually” to open the original review matrix while retaining existing scores and comments. Do not mistake “One expert has finished” for “This question’s result has been fully aggregated.”<\/p><p class=\"secondary\">Resuming reuses compatible saved results. Recognizing all materials again or regrading the entire batch reruns a broader scope. Read the button labels and prompts carefully before starting.<\/p><figure class=\"figure\" style=\"max-width:2000px\"><button type=\"button\" class=\"zoom-image\" aria-label=\"Enlarge: Grading is paused; completed results are retained and the remaining work can be resumed.\"><img src=\"assets/captures/en/18-grading-recovery.jpg\" alt=\"Grading is paused; completed results are retained and the remaining work can be resumed.\" width=\"2800\" height=\"2000\" loading=\"lazy\" decoding=\"async\"><\/button><figcaption><span>Figure 10.4a<\/span><span>Grading is paused; completed results are retained and the remaining work can be resumed.<\/span><small>Click to enlarge<\/small><\/figcaption><\/figure><\/section><nav class=\"page-nav\" aria-label=\"Chapter navigation\"><a href=\"#submissions\"><small>Previous<\/small>Upload and review student submissions<\/a><a href=\"#review\"><small>Next<\/small>Review scores and regrade<\/a><\/nav><footer class=\"page-foot\"><span>SmarTAI · User Manual<\/span><a href=\"#grading\">Back to chapter top ↑<\/a><\/footer><\/article><article class=\"chapter\" id=\"review\" data-group=\"manual\" data-title=\"Review scores and regrade\" data-number=\"11\" tabindex=\"-1\"><p class=\"breadcrumb\">User Manual<span>/<\/span>11 Review scores and regrade<\/p><header class=\"chapter-heading\"><div class=\"chapter-number\">Chapter 11<\/div><h1>11 Review scores and regrade<\/h1><p class=\"intro\">Locate issues in the class matrix, then compare answers, grading evidence, and expert feedback to decide final scores.<\/p><\/header><section id=\"review-1\"><h2>11.1 Resolve red items first, then check yellow<\/h2><p>Red items include no valid score, scores outside the range from 0 to the maximum, and items awaiting confirmation after a valid score has been supplied. Open details, enter a score, save, and confirm before continuing.<\/p><p>Yellow items include low-confidence scores, expert disagreement, and partial expert failures where valid scores are available. A score of 0 is valid; model failure must not be recorded as 0.<\/p><p class=\"secondary\">Low-confidence warnings use a fixed threshold of 0.60. Expert disagreement means that the population standard deviation of at least two valid expert scores, divided by the question’s maximum score, is strictly greater than 15%. These warnings do not themselves block access to results.<\/p><figure class=\"figure\" style=\"max-width:2000px\"><button type=\"button\" class=\"zoom-image\" aria-label=\"Enlarge: The review matrix shows per-question results and distinguishes required actions from recommended reviews.\"><img src=\"assets/captures/en/19-review-matrix.jpg\" alt=\"The review matrix shows per-question results and distinguishes required actions from recommended reviews.\" width=\"2800\" height=\"2000\" loading=\"lazy\" decoding=\"async\"><\/button><figcaption><span>Figure 11.1a<\/span><span>The review matrix shows per-question results and distinguishes required actions from recommended reviews.<\/span><small>Click to enlarge<\/small><\/figcaption><\/figure><\/section><section id=\"review-2\"><h2>11.2 Review and confirm each question<\/h2><p>Click a student and question in the matrix to open details. Review the recognized answer, original file, grading evidence, and each expert’s score and comments. If needed, edit the teacher’s final score and annotations, then save and confirm.<\/p><p>Confirmation and navigation buttons are grouped together for continuous review of previous and next questions. Save or cancel current edits before confirming. Bulk confirmation applies only to eligible items and cannot conceal missing scores.<\/p><p class=\"note\">The score matrix does not add question or student rows. To change counts, use the earlier question or submission preparation pages.<\/p><figure class=\"figure\" style=\"max-width:2000px\"><button type=\"button\" class=\"zoom-image\" aria-label=\"Enlarge: View scoring steps, confidence, and each expert’s original results.\"><img src=\"assets/captures/en/20-review-detail.jpg\" alt=\"View scoring steps, confidence, and each expert’s original results.\" width=\"1034\" height=\"2644\" loading=\"lazy\" decoding=\"async\"><\/button><figcaption><span>Figure 11.2a<\/span><span>View scoring steps, confidence, and each expert’s original results.<\/span><small>Click to enlarge<\/small><\/figcaption><\/figure><figure class=\"figure\" style=\"max-width:2000px\"><button type=\"button\" class=\"zoom-image\" aria-label=\"Enlarge: Record final scores and additional comments in the teacher’s final result area.\"><img src=\"assets/captures/en/20b-teacher-result.jpg\" alt=\"Record final scores and additional comments in the teacher’s final result area.\" width=\"1034\" height=\"600\" loading=\"lazy\" decoding=\"async\"><\/button><figcaption><span>Figure 11.2b<\/span><span>Record final scores and additional comments in the teacher’s final result area.<\/span><small>Click to enlarge<\/small><\/figcaption><\/figure><\/section><section id=\"review-3\"><h2>11.3 Retry failed items or regrade the entire batch<\/h2><ul><li><strong>Retry failed items only<\/strong>: completes unfinished model work while retaining saved teacher score changes and annotations.<\/li><li><strong>Regrade entire batch<\/strong>: opens regrading settings and a summary, then explicitly starts a new round. It reruns grading even when inputs are unchanged.<\/li><\/ul><p>Historical reports retain their original version content. After reviewing the new round, generate a new version on the report page. Previously downloaded reports are not silently rewritten.<\/p><\/section><nav class=\"page-nav\" aria-label=\"Chapter navigation\"><a href=\"#grading\"><small>Previous<\/small>Configure and run grading<\/a><a href=\"#results\"><small>Next<\/small>Results analysis and reports<\/a><\/nav><footer class=\"page-foot\"><span>SmarTAI · User Manual<\/span><a href=\"#review\">Back to chapter top ↑<\/a><\/footer><\/article><article class=\"chapter\" id=\"results\" data-group=\"manual\" data-title=\"Results analysis and reports\" data-number=\"12\" tabindex=\"-1\"><p class=\"breadcrumb\">User Manual<span>/<\/span>12 Results analysis and reports<\/p><header class=\"chapter-heading\"><div class=\"chapter-number\">Chapter 12<\/div><h1>12 Results analysis and reports<\/h1><p class=\"intro\">“Learning analysis and export” separates the class overview, question analysis, student analysis, charts, and downloads.<\/p><\/header><section id=\"results-1\"><h2>12.1 Overview and question analysis<\/h2><p>The overview shows student and question counts, the class average score percentage, pass rate, score distribution, and weaker questions. Click “Question analysis” to examine performance by question, then open details for question materials, student answers, and scores.<\/p><p>Search, filters, and sorting help locate low-scoring questions or items needing review. To change scores, use “Back to review records.” Statistics and charts update after saving.<\/p><figure class=\"figure\" style=\"max-width:2000px\"><button type=\"button\" class=\"zoom-image\" aria-label=\"Enlarge: The results overview summarizes class performance, score distribution, and weaker questions.\"><img src=\"assets/captures/en/21-result-overview.jpg\" alt=\"The results overview summarizes class performance, score distribution, and weaker questions.\" width=\"2800\" height=\"2214\" loading=\"lazy\" decoding=\"async\"><\/button><figcaption><span>Figure 12.1a<\/span><span>The results overview summarizes class performance, score distribution, and weaker questions.<\/span><small>Click to enlarge<\/small><\/figcaption><\/figure><figure class=\"figure\" style=\"max-width:2000px\"><button type=\"button\" class=\"zoom-image\" aria-label=\"Enlarge: Question analysis shows scores and review indicators by question, with links to details.\"><img src=\"assets/captures/en/22-question-analysis.jpg\" alt=\"Question analysis shows scores and review indicators by question, with links to details.\" width=\"2800\" height=\"2200\" loading=\"lazy\" decoding=\"async\"><\/button><figcaption><span>Figure 12.1b<\/span><span>Question analysis shows scores and review indicators by question, with links to details.<\/span><small>Click to enlarge<\/small><\/figcaption><\/figure><figure class=\"figure\" style=\"max-width:2000px\"><button type=\"button\" class=\"zoom-image\" aria-label=\"Enlarge: Question details bring statistics and question materials together for checking.\"><img src=\"assets/captures/en/22b-question-detail-analysis.jpg\" alt=\"Question details bring statistics and question materials together for checking.\" width=\"2800\" height=\"3450\" loading=\"lazy\" decoding=\"async\"><\/button><figcaption><span>Figure 12.1c<\/span><span>Question details bring statistics and question materials together for checking.<\/span><small>Click to enlarge<\/small><\/figcaption><\/figure><\/section><section id=\"results-2\"><h2>12.2 Student analysis<\/h2><p>The student table shows total scores, score percentages, question scores, and review indicators, with column sorting and filtering. Open a student’s details for individual performance by question; click a specific score to locate that question.<\/p><p>Enter clear conditions in Ask, for example, “Filter students with score percentages below 60%, sorted from lowest to highest.” Check the returned filter conditions and clear them when needed to restore the whole class.<\/p><p class=\"secondary\">For duplicate or exact names, supply identity details when prompted for clarification. Confidence is a signal for checking results, not a measure of student ability.<\/p><figure class=\"figure\" style=\"max-width:2000px\"><button type=\"button\" class=\"zoom-image\" aria-label=\"Enlarge: Student analysis shows total scores, score percentages, and per-question scores, with navigation to specific questions.\"><img src=\"assets/captures/en/23-student-analysis.jpg\" alt=\"Student analysis shows total scores, score percentages, and per-question scores, with navigation to specific questions.\" width=\"2800\" height=\"2232\" loading=\"lazy\" decoding=\"async\"><\/button><figcaption><span>Figure 12.2a<\/span><span>Student analysis shows total scores, score percentages, and per-question scores, with navigation to specific questions.<\/span><small>Click to enlarge<\/small><\/figcaption><\/figure><\/section><section id=\"results-3\"><h2>12.3 Ask and visual analysis<\/h2><p>In “Visual analysis,” describe the subjects, measures, and chart type, for example, “Compare average score percentages by question” or “Plot total score percentage against average confidence in a scatter plot.” Chart generation calls a model as needed.<\/p><p>Ask can request charts, filters, and sorting in one request. Charts and the main table can use different scopes, such as a whole-class chart alongside a list of low-scoring students. Check the sample and scope labeled on each chart.<\/p><p>Default charts include score-percentage distribution, pass/fail composition, per-question score percentages and review counts, scatter plots, and student × question heatmaps. Use the page controls to export charts or print.<\/p><p class=\"note\">For custom charts, “Save for this browsing session” does not generate an official report. Export promptly if you need a lasting copy.<\/p><figure class=\"figure\" style=\"max-width:2000px\"><button type=\"button\" class=\"zoom-image\" aria-label=\"Enlarge: Describe your analysis request in Ask; view the default score-percentage distribution directly below.\"><img src=\"assets/captures/en/24-visual-analysis.jpg\" alt=\"Describe your analysis request in Ask; view the default score-percentage distribution directly below.\" width=\"2800\" height=\"4598\" loading=\"lazy\" decoding=\"async\"><\/button><figcaption><span>Figure 12.3a<\/span><span>Describe your analysis request in Ask; view the default score-percentage distribution directly below.<\/span><small>Click to enlarge<\/small><\/figcaption><\/figure><figure class=\"figure\" style=\"max-width:2000px\"><button type=\"button\" class=\"zoom-image\" aria-label=\"Enlarge: Default analysis includes question comparisons, scatter plots, and a student-by-question score heatmap.\"><img src=\"assets/captures/en/24b-default-charts.jpg\" alt=\"Default analysis includes question comparisons, scatter plots, and a student-by-question score heatmap.\" width=\"2596\" height=\"2428\" loading=\"lazy\" decoding=\"async\"><\/button><figcaption><span>Figure 12.3b<\/span><span>Default analysis includes question comparisons, scatter plots, and a student-by-question score heatmap.<\/span><small>Click to enlarge<\/small><\/figcaption><\/figure><\/section><section id=\"results-4\"><h2>12.4 Generate and download reports<\/h2><ol><li>Open “Reports and downloads” and confirm that review requirements are satisfied.<\/li><li>If the latest report has not been generated, click generate report.<\/li><li>Download individual files or download everything as a ZIP.<\/li><li>After changing scores or regrading, regenerate reports and check the version number and generation time.<\/li><\/ol><ul><li>Grade sheet CSV: final scores, total score percentages, and scores by question.<\/li><li>Learning report Markdown: factual summaries for the class, questions, and students.<\/li><li>Publication-ready reference answers in Markdown / LaTeX: question text, grading criteria, and reference answers.<\/li><li>Official results JSON: a complete results snapshot.<\/li><\/ul><p class=\"secondary\">Historical versions can be downloaded separately. Deleting a historical report does not delete grading scores or review records. When current page data changes, older reports still retain their content as generated.<\/p><figure class=\"figure\" style=\"max-width:2000px\"><button type=\"button\" class=\"zoom-image\" aria-label=\"Enlarge: The report page shows versions, generation times, and download links for each file.\"><img src=\"assets/captures/en/25-reports.jpg\" alt=\"The report page shows versions, generation times, and download links for each file.\" width=\"2800\" height=\"2116\" loading=\"lazy\" decoding=\"async\"><\/button><figcaption><span>Figure 12.4a<\/span><span>The report page shows versions, generation times, and download links for each file.<\/span><small>Click to enlarge<\/small><\/figcaption><\/figure><\/section><nav class=\"page-nav\" aria-label=\"Chapter navigation\"><a href=\"#review\"><small>Previous<\/small>Review scores and regrade<\/a><a href=\"#settings\"><small>Next<\/small>Account settings and common issues<\/a><\/nav><footer class=\"page-foot\"><span>SmarTAI · User Manual<\/span><a href=\"#results\">Back to chapter top ↑<\/a><\/footer><\/article><article class=\"chapter\" id=\"settings\" data-group=\"manual\" data-title=\"Account settings and common issues\" data-number=\"13\" tabindex=\"-1\"><p class=\"breadcrumb\">User Manual<span>/<\/span>13 Account settings and common issues<\/p><header class=\"chapter-heading\"><div class=\"chapter-number\">Chapter 13<\/div><h1>13 Account settings and common issues<\/h1><p class=\"intro\">Adjust display preferences and check storage usage. When something blocks progress, start with the reason shown on the page.<\/p><\/header><section id=\"settings-1\"><h2>13.1 Interface and storage<\/h2><p>Open the username menu in the upper-right corner → “Account settings” to view your username, email, and role. Choose Chinese or English, and light, dark, or system appearance. Interface preferences are saved only in the current browser.<\/p><p>Task original-file storage includes original questions, submission packages, and original student answers; library storage is counted separately. When originals are cleaned up under retention rules, structured results, analysis, and long-term library content remain, but original-file previews may no longer be available.<\/p><p>You can also manage local drafts in account settings. Before deleting, confirm that you no longer need the content that has not been formally saved.<\/p><p>Task-original storage and knowledge storage have separate default limits of 512 MB each (the UI label; technically 512 MiB, or 536,870,912 bytes). Administrators can change these quotas. Use the limit shown on your current page.<\/p><figure class=\"figure\" style=\"max-width:2000px\"><button type=\"button\" class=\"zoom-image\" aria-label=\"Enlarge: Account settings show task original-file storage and let you change interface language and appearance.\"><img src=\"assets/captures/en/26-settings.jpg\" alt=\"Account settings show task original-file storage and let you change interface language and appearance.\" width=\"2800\" height=\"2624\" loading=\"lazy\" decoding=\"async\"><\/button><figcaption><span>Figure 13.1a<\/span><span>Account settings show task original-file storage and let you change interface language and appearance.<\/span><small>Click to enlarge<\/small><\/figcaption><\/figure><\/section><section id=\"settings-2\"><h2>13.2 A button is unavailable<\/h2><p>Click or read the reason near the button. Common causes include a missing question file, no available model, a roster not yet uploaded, files being checked, the material limit being reached, or unresolved red required items. Follow the prompt to resolve the issue before continuing.<\/p><p>If an “Action required” item remains after you fixed it, check whether you saved the content but have not yet confirmed it. Do not repeatedly save unchanged content or clear flags to bypass genuine missing information.<\/p><\/section><section id=\"settings-3\"><h2>13.3 Model failures, page conflicts, or missing files<\/h2><ul><li>Key or permission issues: check the provider, API key, and model ID in “Models &amp; BYOK.”<\/li><li>Model or endpoint not found: check both the Model ID and Base URL.<\/li><li>Timeout or rate limiting: retain current files and configuration, then retry later or choose another available model.<\/li><li>Content changed on another page: reload the latest state, check retained edits, then save.<\/li><li>Only a filename remains: select the file again. Original reusable: continue directly. Check failed: retry the check first.<\/li><\/ul><p class=\"action\">Prefer “Resume” or “Retry failed items only” to complete remaining work. Choose “Recognize all again” or “Regrade entire batch” only when a complete rerun is needed.<\/p><\/section><nav class=\"page-nav\" aria-label=\"Chapter navigation\"><a href=\"#results\"><small>Previous<\/small>Results analysis and reports<\/a><\/nav><footer class=\"page-foot\"><span>SmarTAI · User Manual<\/span><a href=\"#settings\">Back to chapter top ↑<\/a><\/footer><\/article><article class=\"chapter\" id=\"api-smartai\" data-group=\"api\" data-title=\"Configure models in SmarTAI\" data-number=\"1\" tabindex=\"-1\"><p class=\"breadcrumb\">Models & API Guide<span>/<\/span>1 Configure models in SmarTAI<\/p><header class=\"chapter-heading\"><div class=\"chapter-number\">Chapter 1<\/div><h1>1 Configure models in SmarTAI<\/h1><p class=\"intro\">Add your own API Key, save the configuration, and test text and image capabilities as needed.<\/p><\/header><section id=\"api-overview\"><h2>Before you begin<\/h2><p>SmarTAI supports models from different providers using your own API Key. Add a configuration by following the steps below.<\/p><div class=\"note\"><p><strong>No local proxy setup required:<\/strong> Model requests are sent by SmarTAI's platform servers. You do not need to enable or switch a local VPN/network proxy for different providers. Actual requests must still meet the provider's account permission, supported-region, and API connectivity requirements.<\/p><\/div><p class=\"secondary\">Guide version: October 2026. Model names and main quota details were checked through October 19, 2026. Models, free quotas, application procedures, and request limits may change. Refer to the provider's official documentation and your own account console for current information.<\/p><\/section><section id=\"api-entry\"><h2>Open “Models &amp; BYOK”<\/h2><p><strong>Option one:<\/strong> Click your username in the upper-right corner → <strong>Models & BYOK<\/strong>.<\/p><p><strong>Option two:<\/strong> Click <strong>x/x models enabled<\/strong> at the top → Open model management from the expanded menu.<\/p><p>On the “Models & BYOK” page, click <strong>Add model configuration<\/strong> in the upper-right corner. The image below marks both entry points together, followed by the Add button on the configuration page. Red boxes are explanatory annotations; the underlying images are actual interface screenshots.<\/p><figure class=\"figure\" style=\"max-width:2000px\"><button type=\"button\" class=\"zoom-image\" aria-label=\"Enlarge: The two outlined controls open model management: use the username menu or the enabled-model count.\"><img src=\"assets/captures/en/API1-entry.jpg\" alt=\"The two outlined controls open model management: use the username menu or the enabled-model count.\" width=\"2800\" height=\"420\" loading=\"lazy\" decoding=\"async\"><\/button><figcaption><span>Figure 1.2a<\/span><span>The two outlined controls open model management: use the username menu or the enabled-model count.<\/span><small>Click to enlarge<\/small><\/figcaption><\/figure><figure class=\"figure\" style=\"max-width:2000px\"><button type=\"button\" class=\"zoom-image\" aria-label=\"Enlarge: Both entry points open “Models &amp; BYOK.” Click “Add model configuration” inside the red box at the upper right.\"><img src=\"assets/captures/en/API1c-add.jpg\" alt=\"Both entry points open “Models &amp; BYOK.” Click “Add model configuration” inside the red box at the upper right.\" width=\"2800\" height=\"1732\" loading=\"lazy\" decoding=\"async\"><\/button><figcaption><span>Figure 1.2b<\/span><span>Both entry points open “Models &amp; BYOK.” Click “Add model configuration” inside the red box at the upper right.<\/span><small>Click to enlarge<\/small><\/figcaption><\/figure><\/section><section id=\"api-fields\"><h2>Complete and save the configuration<\/h2><p>First, find your provider in <a href=\"#api-providers\">Section 2<\/a>, follow the steps to obtain a key, and then enter the following details.<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">Field<\/th><th scope=\"col\">What to enter<\/th><\/tr><\/thead><tbody><tr><td><strong>Provider<\/strong><\/td><td>Select the relevant provider.<\/td><\/tr><tr><td><strong>Configuration name<\/strong><\/td><td>Optional, for example, “Assignment grading” or “Image recognition.” If left blank, the model name is used by default.<\/td><\/tr><tr><td><strong>Model name<\/strong><\/td><td>Copy the provider's <strong>Model ID<\/strong>. This is the name used to call the model, such as <code>gemini-3.5-flash-lite<\/code>, rather than its Chinese display name.<\/td><\/tr><tr><td><strong>API key<\/strong><\/td><td>Paste the key you just obtai
