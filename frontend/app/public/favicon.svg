  <title id="title">SmarTAI integral fountain-pen mark v4</title>
  <desc id="desc">The approved flat integral-pen silhouette with a seamless curled terminal and the refined near-circular nib aperture.</desc>
  <metadata>
    Round-15 v4 preserves the complete round-15 v3 outer silhouette, seamless curled terminal,
    centered aperture, symmetric nib slit, and all other geometry. The transparent nib aperture is
    slightly smaller and subtly elongated along the nib axis; its center remains unchanged.
    Gradient remains #5EB5F1 to #489FEC to #419BE9.
  </metadata>
