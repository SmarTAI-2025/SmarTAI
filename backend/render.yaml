# SmarTAI backend — Render free-tier blueprint
#
# Deploy from repo root (Render picks this up via "Blueprint" / Web Service
# create flow). The Python service runs on Render's free tier (512 MB RAM,
# spins down after 15 min of inactivity — KB / Task state is lost on sleep).
#
# Provider keys are entered only in Render's secret Environment UI. This
# isolated Frontier demo branch intentionally uses one server-side Gemini key
# for synthetic fixtures; the normal product continues to prefer BYOK.

services:
  - type: web
    name: smartai-backend
    env: python
    plan: free
    rootDir: .
    buildCommand: pip install -r render-requirements.txt
    startCommand: alembic upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"   # Render supports the backend's numpy/langchain stack.
      - key: SMARTAI_GRADING_ENGINE
        value: v2
      # Leave empty when this host can reach overseas providers directly; set
      # only when the deployment needs an outbound proxy. Zhipu always bypasses it.
      - key: SMARTAI_HTTP_PROXY
        value: ""
      - key: SMARTAI_HTTPS_PROXY
        value: ""   # ✅ 云端正确
      # Auth: Render auto-generates a strong random on first deploy and
      # keeps it stable across redeploys.
      - key: JWT_SECRET
        generateValue: true    # ✅ 自动生成
      - key: SMARTAI_REQUIRE_AUTH
        value: "true"
      - key: SMARTAI_REGISTRATION_CLOSED
        value: "true"
      - key: SMARTAI_DATABASE_URL
        sync: false
      - key: SMARTAI_DATABASE_URL_HEAVY
        sync: false
      - key: SMARTAI_DATABASE_HEAVY
        value: "ON"
      - key: SMARTAI_DATABASE_AUTO_CREATE
        value: "false"
      - key: SMARTAI_STORAGE_ROOT
        value: "/var/data/uploads"  # local fallback; Render Free uses object storage below
      - key: SMARTAI_STORAGE_BACKEND
        value: "object"
      - key: SMARTAI_PROVIDER_ENCRYPTION_KEY
        sync: false
      - key: SMARTAI_STORAGE_S3_ENDPOINT
        sync: false
      - key: SMARTAI_STORAGE_S3_BUCKET
        sync: false
      - key: SMARTAI_STORAGE_S3_REGION
        value: "auto"
      - key: SMARTAI_STORAGE_S3_ACCESS_KEY
        sync: false
      - key: SMARTAI_STORAGE_S3_SECRET_KEY
        sync: false
      - key: SMARTAI_REFRESH_COOKIE_SECURE
        value: "true"
      - key: SMARTAI_REFRESH_COOKIE_SAMESITE
        value: "none"
      - key: SMARTAI_SEED_TEST_USERS
        value: "false"
      # AWS Frontier application demo: passwordless short task sessions backed
      # by one server-side Gemini key. This branch uses synthetic fixtures only.
      - key: SMARTAI_FRONTIER_DEMO_ENABLED
        value: "true"
      - key: SMARTAI_FRONTIER_DEMO_SESSION_MINUTES
        value: "20"
      - key: SMARTAI_FRONTIER_DEMO_DAILY_SESSION_LIMIT
        value: "12"
      - key: SMARTAI_FRONTIER_DEMO_SESSION_COOLDOWN_SECONDS
        value: "5"
      - key: SMARTAI_SHARED_POOL_ENABLED
        value: "true"
      - key: SMARTAI_SHARED_POOL_DAILY_REQUEST_LIMIT
        value: "100"
      - key: SMARTAI_SHARED_POOL_DAILY_ESTIMATED_TOKEN_LIMIT
        value: "250000"
      - key: SMARTAI_GEMINI_MODEL
        value: "gemini-3.5-flash"
      - key: SMARTAI_GEMINI_API_KEY
        sync: false
      # Frontend URL — fill in after Vercel deploys. Comma-separated list
      # for CORS. Localhost included so you can do mixed dev (frontend
      # local, backend deployed) while iterating.
      - key: FRONTEND_URLS
        value: "http://localhost:3000,http://localhost:8001"  # TODO: ⚠️ 占位，部署完要改
      # ──────────────────────────────────────────────────────────────────
      # LLM keys — DO NOT set these here unless you're the only user. The
      # /experts BYOK flow is the recommended path. If you do set one,
      # users will inherit it (and the cost). Listed for documentation only:
      #
      # - key: SMARTAI_OPENAI_API_KEY
      #   value: ""
      # - key: SMARTAI_ZHIPU_API_KEY
      #   value: ""
      # - key: SMARTAI_ANTHROPIC_API_KEY
      #   value: ""
