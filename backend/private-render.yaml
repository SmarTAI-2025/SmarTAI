# Example only; no deployment is authorized by this patch.
# Private service, never a public web service. An authenticated VPN/gateway
# must provide browser access to the separately built admin SPA and /api.
# https://render.com/docs/blueprint-spec
services:
  - type: pserv
    name: smartai-admin-private
    runtime: python
    plan: starter
    rootDir: .
    buildCommand: >-
      python -m pip install --require-hashes --only-binary=:all: -r render-requirements.txt
      && python -m pip check
      && npm --prefix frontend/app ci
      && npm --prefix frontend/app run build:admin
    # Apply migrations once, before starting either public or private services.
    startCommand: uvicorn backend.private_main:app --host 0.0.0.0 --port $PORT --no-access-log
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: NODE_VERSION
        value: "22.22.2"
      - key: SMARTAI_RUNTIME_ENVIRONMENT
        value: production
      - key: SMARTAI_ADMIN_PRIVATE_ENABLED
        value: "true"
      - key: SMARTAI_GRADING_ENGINE
        value: v2
      - key: SMARTAI_REQUIRE_AUTH
        value: "true"
      - key: SMARTAI_DATABASE_HEAVY
        value: "ON"
      - key: SMARTAI_DATABASE_URL_HEAVY
        sync: false
      - key: SMARTAI_DATABASE_AUTO_CREATE
        value: "false"
      - key: SMARTAI_SEED_TEST_USERS
        value: "false"
      # Reuse the existing deployment values. Never generate/rotate either key.
      - key: SMARTAI_JWT_SECRET
        sync: false
      - key: SMARTAI_PROVIDER_ENCRYPTION_KEY
        sync: false
      - key: SMARTAI_REFRESH_COOKIE_SECURE
        value: "true"
      - key: SMARTAI_REFRESH_COOKIE_SAMESITE
        value: "strict"
      - key: SMARTAI_ADMIN_FRONTEND_ORIGIN
        sync: false
      - key: SMARTAI_PUBLIC_FRONTEND_URL
        sync: false
      - key: VITE_SMARTAI_BACKEND_URL
        value: /api
      # Match the existing public service's object backend and exact bucket.
      - key: SMARTAI_STORAGE_BACKEND
        value: object
      - key: SMARTAI_STORAGE_S3_ENDPOINT
        sync: false
      - key: SMARTAI_STORAGE_S3_BUCKET
        sync: false
      - key: SMARTAI_STORAGE_S3_REGION
        sync: false
      - key: SMARTAI_STORAGE_S3_ACCESS_KEY
        sync: false
      - key: SMARTAI_STORAGE_S3_SECRET_KEY
        sync: false
      # Reuse the configured relay; test deployments must use an isolated sink.
      - key: SMARTAI_SMTP_HOST
        sync: false
      - key: SMARTAI_SMTP_PORT
        sync: false
      - key: SMARTAI_SMTP_SECURITY
        sync: false
      - key: SMARTAI_SMTP_USERNAME
        sync: false
      - key: SMARTAI_SMTP_PASSWORD
        sync: false
      - key: SMARTAI_MAIL_FROM_ADDRESS
        sync: false
