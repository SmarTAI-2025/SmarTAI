name: Runner isolation spike

on:
  push:
    paths:
      - "tools/runner_spike/**"
      - "tools/evaluation/programming/replay_u1.py"
      - "backend/services/programming*.py"
      - "backend/skills/programming*.py"
      - "backend/tests/test_programming_saved_grading_flow.py"
      - "backend/tests/test_programming_scoring_contract.py"
      - "backend/tools/grading_runner.py"
      - "backend/tools/oci_grading_runner.py"
      - "backend/tools/code_interpreter.py"
      - "backend/tests/test_oci*.py"
      - "backend/tests/test_runner_spike.py"
      - ".github/workflows/runner-spike.yml"
      - ".python-version"
  pull_request:
    branches: [main]
    paths:
      - "tools/runner_spike/**"
      - "tools/evaluation/programming/replay_u1.py"
      - "backend/services/programming*.py"
      - "backend/skills/programming*.py"
      - "backend/tests/test_programming_saved_grading_flow.py"
      - "backend/tests/test_programming_scoring_contract.py"
      - "backend/tools/grading_runner.py"
      - "backend/tools/oci_grading_runner.py"
      - "backend/tools/code_interpreter.py"
      - "backend/tests/test_oci*.py"
      - "backend/tests/test_runner_spike.py"
      - ".github/workflows/runner-spike.yml"
      - ".python-version"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oci-isolation-probe:
    name: OCI isolation acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Build candidate image
        run: python tools/runner_spike/harness.py build --runtime docker
      - name: Probe env, network, directory and process isolation
        run: python tools/runner_spike/harness.py probe --runtime docker --json
      - name: Install pinned backend test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt
      - name: Test the application adapter against the real OCI runtime
        env:
          SMARTAI_OCI_REAL_TEST: "1"
          SMARTAI_RUNTIME_ENVIRONMENT: test
          SMARTAI_PROGRAM_RUNNER_IMAGE: smartai-runner-spike:week1
        run: |
          export SMARTAI_PROGRAM_RUNNER_IMAGE="$(docker image inspect --format '{{.Id}}' smartai-runner-spike:week1)"
          export SMARTAI_U1_NATIVE_EVIDENCE="$RUNNER_TEMP/u1-native-evidence.json"
          printf 'FROM smartai-runner-spike:week1\nUSER root\nRUN rm /usr/bin/gcc\nUSER 65534:65534\n' |
            docker build --network=none -t smartai-qa-without-gcc -
          export SMARTAI_TEST_BROKEN_CC_IMAGE="$(docker image inspect --format '{{.Id}}' smartai-qa-without-gcc)"
          git fetch --depth=1 origin ab36293b5b00ea2dd20803cd89c727398671c835
          python -m pytest backend/tests/test_oci_real_runtime.py backend/tests/test_oci_native.py -q
      - name: Save synthetic U1 native evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: u1-native-evidence
          path: ${{ runner.temp }}/u1-native-evidence.json
          if-no-files-found: error
      - name: Check container cleanup
        if: always()
        run: test -z "$(docker ps -aq --filter label=smartai.isolated-runner=true)"
