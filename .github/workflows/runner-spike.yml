name: Runner isolation spike

on:
  push:
    paths:
      - "tools/runner_spike/**"
      - "backend/tools/grading_runner.py"
      - "backend/tests/test_runner_spike.py"
      - ".github/workflows/runner-spike.yml"
      - ".python-version"
  pull_request:
    branches: [main]
    paths:
      - "tools/runner_spike/**"
      - "backend/tools/grading_runner.py"
      - "backend/tests/test_runner_spike.py"
      - ".github/workflows/runner-spike.yml"
      - ".python-version"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oci-isolation-probe:
    name: OCI isolation acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Build candidate image
        run: python tools/runner_spike/harness.py build --runtime docker
      - name: Probe env, network, directory and process isolation
        run: python tools/runner_spike/harness.py probe --runtime docker --json
